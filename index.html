<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IKEMEN LAB">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>IKEMEN LAB — 総合セルフマネジメント</title>
<style>
:root{
  /* ライトテーマ：白基調・文字のコントラストを優先 */
  --bg:#eef2f7; --bg2:#ffffff; --card:#ffffff; --card2:#f2f5fa; --line:#dde4ee;
  --txt:#16202e; --sub:#55647a; --dim:#8492a6;
  --accent:#0d6efd; --accent2:#6b3fd4;
  --good:#12854a; --warn:#a1660a; --bad:#c62f3b; --info:#0d6efd;
  --chest:#d8453d; --back:#1268c3; --shoulder:#b07d10; --arm:#6f4bd0; --leg:#1a8047; --core:#c43f7f;
  --onmus:#ffffff;
  --r:14px; --shadow:0 2px 10px rgba(22,32,46,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #dbe6f5 0%, var(--bg) 55%) no-repeat, var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;
  font-size:15px; line-height:1.6; padding-bottom:calc(96px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:.02em}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
/* ---------- 栄養素14項目（塩梅） ---------- */
.nhero{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.nring{position:relative;width:92px;height:92px;flex:none}
.nring svg{width:100%;height:100%;transform:rotate(-90deg)}
.nring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.nring .v b{font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.nring .v span{font-size:10px;color:var(--dim);margin-top:3px}
.nut{display:grid;grid-template-columns:76px 1fr auto;gap:7px 10px;align-items:center;font-size:12px;margin-top:6px}
.nut .lbl{color:var(--sub);white-space:nowrap}
.nbar{position:relative;height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.nbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.nbar .tgt{position:absolute;top:0;bottom:0;width:2px;background:var(--txt);opacity:.3;left:66.67%}
.nut .val{text-align:right;color:var(--txt);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:11.5px}
.nmsg{margin:0 0 10px;font-size:13.5px;line-height:1.55}
.nmsg .tg{display:inline-block;font-size:10.5px;padding:0 7px;border-radius:99px;margin-right:6px;color:#fff;vertical-align:1px}
.nsugg{display:flex;flex-direction:column;gap:6px;margin:6px 0 12px}
.nsugg button{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:9px 11px}
.nsugg button>span{flex:1;font-size:13.5px}
.nsugg small{display:block;color:var(--dim);font-size:11px}
.fbadge{font-size:10px;border:1px solid var(--warn);color:var(--warn);border-radius:6px;padding:0 5px;margin-left:5px;font-weight:400;vertical-align:1px}
/* ---------- マイ食品：栄養成分表示ふうの入力欄 ---------- */
.lbl-box{border:1.5px solid var(--txt);border-radius:6px;background:var(--bg2);padding:2px 10px;margin-top:10px}
.lbl-head{font-size:13px;font-weight:700;padding:7px 0;border-bottom:1.5px solid var(--txt)}
.lbl-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.lbl-row:last-child{border-bottom:0}
.lbl-row>span:first-child{flex:1}
.lbl-row.sub>span:first-child{color:var(--sub);font-size:13px}
.lbl-in{display:flex;align-items:center;gap:5px;width:132px}
.lbl-in input{width:100%;text-align:right;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:var(--card)}
.lbl-in em{font-style:normal;font-size:12px;color:var(--dim);width:30px}
.hidden{display:none !important}

/* ---------- layout ---------- */
.wrap{max-width:860px;margin:0 auto;
  padding-left:max(14px, env(safe-area-inset-left));
  padding-right:max(14px, env(safe-area-inset-right))}
.appbar{
  position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:rgba(255,255,255,.88);border-bottom:1px solid var(--line);
  /* iPhoneのステータスバー（時計・Dynamic Island）に隠れないよう、セーフエリア分だけ下げる */
  padding-top:env(safe-area-inset-top);
}
.appbar-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px;
  padding:10px max(14px, env(safe-area-inset-right)) 10px max(14px, env(safe-area-inset-left))}
.brand{font-weight:800;font-size:17px;letter-spacing:.06em;
  background:linear-gradient(92deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:10px;letter-spacing:.18em;color:var(--dim);-webkit-text-fill-color:var(--dim)}
.datenav{margin-left:auto;display:flex;align-items:center;gap:4px}
.datenav button{background:var(--card2);border:1px solid var(--line);border-radius:9px;width:32px;height:32px;line-height:1;font-size:14px}
.datenav .today{width:auto;padding:0 10px;font-size:12px;white-space:nowrap}
@media(max-width:430px){
  .brand{font-size:15px}
  .brand small{display:none}
  #dateLabel{min-width:84px;font-size:12px}
  .appbar-in{gap:8px}
}
#dateLabel{font-size:13px;color:var(--sub);min-width:104px;text-align:center;font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:6px;overflow-x:auto;max-width:860px;margin:0 auto;scrollbar-width:none;
  padding:10px max(14px, env(safe-area-inset-right)) 2px max(14px, env(safe-area-inset-left))}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--sub);
  padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600;transition:.15s;
}
.tabs button.on{background:linear-gradient(92deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card.tight{padding:13px}
.card h3{font-size:14px;color:var(--sub);letter-spacing:.08em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3.sect{cursor:pointer;user-select:none;margin-bottom:0;padding:2px 0}
.card.open h3.sect{margin-bottom:12px}
.card h3.sect .chev{display:inline-block;width:14px;color:var(--dim);font-size:11px;transition:transform .18s}
.card h3.sect .done{font-size:11px;color:var(--good);font-weight:700;letter-spacing:0}
.card h3.sect:active{opacity:.6}
.card h3 .tag{margin-left:auto;font-size:11px;color:var(--dim);font-weight:600;letter-spacing:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}

/* ---------- score ---------- */
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val b{font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.ring .val span{font-size:10px;color:var(--dim);letter-spacing:.14em;margin-top:4px}
.breakdown{flex:1;min-width:230px;display:flex;flex-direction:column;gap:7px}
.bd-row{display:grid;grid-template-columns:78px 1fr 46px;align-items:center;gap:9px;font-size:12px}
.bd-row .lbl{color:var(--sub)}
.bd-row .num{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.bar{height:7px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s ease}

/* ---------- stats ---------- */
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.stat .k{font-size:10px;color:var(--dim);letter-spacing:.1em}
.stat .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.stat .v small{font-size:11px;color:var(--sub);font-weight:600;margin-left:2px}
.stat .d{font-size:11px;margin-top:1px;font-variant-numeric:tabular-nums}
.up{color:var(--bad)} .down{color:var(--good)} .flat{color:var(--dim)}

/* ---------- advice ---------- */
.adv{display:flex;gap:11px;padding:12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);border-left-width:3px;margin-bottom:9px}
.adv.good{border-left-color:var(--good)} .adv.warn{border-left-color:var(--warn)}
.adv.bad{border-left-color:var(--bad)} .adv.info{border-left-color:var(--info)}
.adv .ico{font-size:18px;line-height:1.4}
.adv .bd{flex:1;min-width:0}
.adv b{display:block;font-size:14px;margin-bottom:2px}
.adv p{margin:0;font-size:12.5px;color:var(--sub);line-height:1.65}
.adv .do{margin-top:6px;font-size:12.5px;color:var(--accent);font-weight:600}
.adv .src{font-size:10px;color:var(--dim);letter-spacing:.06em;margin-top:5px}

/* ---------- forms ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:5px;letter-spacing:.04em}
.field input[type=number],.field input[type=text],.field input[type=date],.field select,.field textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  color:var(--txt);padding:10px 11px;outline:none;transition:.15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(13,110,253,.15)}
.field .unit{position:relative}
.field .unit span{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--dim);pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13px;color:var(--sub);transition:.15s;user-select:none}
.chip.on{background:rgba(13,110,253,.10);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.on.pos{background:rgba(18,133,74,.12);border-color:var(--good);color:var(--good)}
.scale{display:flex;gap:6px}
.scale button{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 0;font-size:13px;color:var(--sub)}
.scale button.on{background:rgba(107,63,212,.12);border-color:var(--accent2);color:var(--accent2);font-weight:700}
.btn{background:linear-gradient(92deg,var(--accent),var(--accent2));border:none;border-radius:11px;padding:12px 18px;font-weight:700;color:#fff;white-space:nowrap}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--txt);font-weight:600}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn.danger{background:var(--card2);border:1px solid rgba(198,47,59,.45);color:var(--bad)}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.sec-title{font-size:12px;color:var(--dim);letter-spacing:.14em;margin:20px 0 9px;font-weight:700}
.hint{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.6}

/* ---------- workout ---------- */
.ex{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.ex-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.ex-head b{flex:1 1 100%}
.ex-head b{font-size:14px}
.mus{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:700;letter-spacing:.04em}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 1fr 30px;gap:6px;align-items:center;margin-bottom:6px}
.setrow .n{font-size:11px;color:var(--dim);text-align:center}
.setrow input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px 7px;text-align:center;outline:none}
.setrow .rm{background:none;border:none;color:var(--dim);font-size:16px}
.setrow.head span{font-size:10px;color:var(--dim);text-align:center}
.prescribe{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:9px;font-size:14px;font-weight:700}
.prescribe b{display:block;font-size:10.5px;color:var(--accent);letter-spacing:.1em;font-weight:700;margin-bottom:2px}
.prescribe .why{display:block;font-size:11.5px;color:var(--sub);font-weight:400;margin-top:3px}
.checkrow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.checkrow:last-of-type{border-bottom:none}
.checkrow .n{font-size:11px;color:var(--dim);width:14px;text-align:center;flex:0 0 auto}
.checkrow .ck{width:38px;height:38px;flex:0 0 auto;border-radius:11px;border:2px solid var(--line);
  background:var(--bg2);font-size:18px;font-weight:800;color:var(--good);line-height:1}
.checkrow.done .ck{background:rgba(18,133,74,.12);border-color:var(--good)}
.checkrow .txt{flex:1;font-size:14px;font-weight:600}
.checkrow.done .txt{color:var(--good)}
.checkrow .rm{background:none;border:none;color:var(--dim);font-size:16px;flex:0 0 auto}
.wlog{border-bottom:1px solid var(--line);padding:11px 0}
.wlog:last-child{border-bottom:none}
.wlog .t{display:flex;gap:9px;align-items:center;font-size:13px}
.wlog .t b{font-size:14px}
.wlog .m{font-size:11.5px;color:var(--sub);margin-top:4px;line-height:1.7}
.pr{background:rgba(161,102,10,.10);border:1px solid rgba(161,102,10,.35);color:var(--warn);font-size:10px;padding:2px 7px;border-radius:99px;font-weight:700}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:10.5px;color:var(--dim);letter-spacing:.06em;font-weight:600}
th:first-child,td:first-child{text-align:left}
.tscroll{overflow-x:auto}

/* ---------- misc ---------- */
.empty{text-align:center;color:var(--dim);font-size:13px;padding:26px 10px;line-height:1.9}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,26px);background:#16202e;color:#fff;
  border:1px solid var(--line);border-radius:11px;padding:11px 20px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:11px 14px calc(11px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:60}
.savebar .in{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:center}
.savebar .in .btn{flex:1}
.legend{display:flex;flex-wrap:wrap;gap:11px;font-size:11px;color:var(--sub);margin-top:9px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.streak{font-size:12px;color:var(--warn);font-weight:700}
.mi{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.mi:last-child{border-bottom:none}
.mi .mus{margin-top:3px;flex:0 0 auto;min-width:34px;text-align:center}
.mi .bd{flex:1;min-width:0}
.mi b{font-size:14px;display:block}
.mi .sub{font-size:12.5px;color:var(--txt);opacity:.9;margin-top:1px}
.mi .why{font-size:11px;color:var(--dim);margin-top:2px}
.tip{background:rgba(13,110,253,.05);border:1px solid rgba(13,110,253,.20);border-radius:11px;padding:11px 13px;margin:8px 0 4px}
.tip div{font-size:12.5px;color:var(--sub);line-height:1.75;margin-bottom:4px}
.tip b{display:block;font-size:10.5px;color:var(--accent);letter-spacing:.08em;margin-bottom:1px}
.tip a{text-decoration:none}
.qm{background:var(--card2);border:1px solid var(--line);border-radius:50%;width:22px;height:22px;line-height:1;
  font-size:12px;color:var(--sub);padding:0;flex:0 0 auto}
.qm.on{background:rgba(13,110,253,.12);border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>

<div class="appbar">
  <div class="appbar-in">
    <div class="brand">IKEMEN LAB<small>TOTAL SELF MANAGEMENT</small></div>
    <div class="datenav">
      <button id="dPrev" title="前日">‹</button>
      <span id="dateLabel"></span>
      <button id="dNext" title="翌日">›</button>
      <button id="dToday" class="today">今日</button>
    </div>
  </div>
  <div class="tabs">
    <button data-tab="home" class="on">ホーム</button>
    <button data-tab="food">食事</button>
    <button data-tab="train">トレーニング</button>
    <button data-tab="log">からだ</button>
    <button data-tab="analysis">分析</button>
    <button data-tab="settings">設定</button>
  </div>
</div>

<div class="wrap">
  <section id="v-home" class="view"></section>
  <section id="v-food" class="view hidden"></section>
  <section id="v-log" class="view hidden"></section>
  <section id="v-train" class="view hidden"></section>
  <section id="v-analysis" class="view hidden"></section>
  <section id="v-settings" class="view hidden"></section>
</div>

<div id="toast"></div>

<script>
/* ================================================================
   IKEMEN LAB — single-file personal optimization app
   データは全て端末内 localStorage に保存されます（外部送信なし）
   ================================================================ */
'use strict';

/* ---------------------------------------------------------------
   1. 定数
   --------------------------------------------------------------- */
const DB_KEY = 'ikemenlab_v1';

const MUSCLES = ['胸','背中','肩','腕','脚','体幹'];
const CARDIO = '有酸素';   // 筋トレのボリュームには数えず、時間（分）で記録する
const MUSCLE_COLOR = {'胸':'var(--chest)','背中':'var(--back)','肩':'var(--shoulder)','腕':'var(--arm)','脚':'var(--leg)','体幹':'var(--core)','有酸素':'var(--sub)'};

// 週あたりの推奨セット数（Schoenfeldらのボリューム研究＋見た目重視の配分）
const VOL_TARGET = {
  '胸':  {min:10, max:20},
  '背中':{min:12, max:22},
  '肩':  {min:12, max:24},   // 三角筋中部は肩幅＝シルエットの要。多めに設定
  '腕':  {min:6,  max:16},
  '脚':  {min:8,  max:18},
  '体幹':{min:4,  max:12}
};

// 種目ライブラリ
//   t : push / pull / core（押す:引く のバランス判定に使用）
//   c : 複合種目フラグ（時間がない日はここから選ぶ）
//   eq: gym=ジム専用 / db=ダンベル・バンドで可 / bw=自重
const EXERCISES = [
  {n:'ベンチプレス',              m:'胸',   t:'push', c:1, eq:'gym'},
  {n:'チェストプレス(マシン)',     m:'胸',   t:'push', c:1, eq:'gym'},
  {n:'ダンベルベンチプレス',       m:'胸',   t:'push', c:1, eq:'db'},
  {n:'インクラインダンベルプレス', m:'胸',   t:'push', c:1, eq:'db'},
  {n:'ダンベルフライ',            m:'胸',   t:'push', c:0, eq:'db'},
  {n:'バンドチェストプレス',       m:'胸',   t:'push', c:1, eq:'db'},
  {n:'腕立て伏せ',                m:'胸',   t:'push', c:1, eq:'bw'},
  {n:'デクライン腕立て伏せ',       m:'胸',   t:'push', c:1, eq:'bw'},
  {n:'ディップス',                m:'胸',   t:'push', c:1, eq:'bw'},

/* ---------------------------------------------------------------

   --------------------------------------------------------------- */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const clamp = (v,a,b)=> Math.max(a, Math.min(b, v));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };
const r1 = v => Math.round(v*10)/10;
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function ymd(d){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s,n){ const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function diffDays(a,b){ return Math.round((parseYmd(b)-parseYmd(a))/86400000); }
function jpDate(s){ const d=parseYmd(s); const w='日月火水木金土'[d.getDay()]; return (d.getMonth()+1)+'/'+d.getDate()+'('+w+')'; }
function isoWeekStart(s){ const d=parseYmd(s); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return ymd(d); } // 月曜始まり

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'), 1900);
}

let S = null;
let VIEW_DATE = ymd(new Date());
let TAB = 'home';

function blankDay(date){
  const off = S && S.profile && (S.profile.offDays||[]).includes(parseYmd(date).getDay());
  return {
    date, shift: off?'off':null, workStart:'', workEnd:'', homeTime:'', meals:[],
    weight:null, bodyFat:null, waist:null,
    bmrScale:null, visceral:null, muscleRate:null,   // 体重計が出す値（基礎代謝・内臓脂肪レベル・骨格筋率）
    kcal:null, protein:null, fat:null, carb:null, water:null, alcohol:null,
    sleepH:null, sleepStart:'', sleepEnd:'', sleepQ:null, steps:null,   // 睡眠はその日の朝に起きた分（前夜の就寝〜今朝の起床）
    mood:null, stress:null, note:''
  };
}

function load(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    S = raw ? JSON.parse(raw) : null;
  }catch(e){ S = null; }
  if(!S || typeof S!=='object'){ S = JSON.parse(JSON.stringify(DEFAULT_STATE)); S.meta.created = ymd(new Date()); }
  // 後方互換：欠けたキーを補完
  S.profile = Object.assign({}, DEFAULT_STATE.profile, S.profile||{});
  S.days = S.days||{}; S.workouts = S.workouts||[]; S.meta = S.meta||{created:ymd(new Date())};
  S.myFoods = S.myFoods||[]; S.templates = S.templates||[];
  Object.keys(S.days).forEach(d=>{ S.days[d] = Object.assign(blankDay(d), S.days[d]); });
}
function save(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(S)); }
  catch(e){ toast('保存に失敗しました（容量超過の可能性）'); }
}
function day(date, create){
  if(!S.days[date] && create) S.days[date] = blankDay(date);
  return S.days[date] || blankDay(date);
}
function sortedDays(){ return Object.keys(S.days).sort(); }
function daysUpTo(date, n){          // 指定日から遡る n 日分（存在するものだけ）
  const out=[];
  for(let i=0;i<n;i++){ const d=addDays(date,-i); if(S.days[d]) out.push(S.days[d]); }
  return out.reverse();
}

/* ---------------------------------------------------------------
   4. 計算エンジン
   --------------------------------------------------------------- */
const E = {};

E.age = ()=> new Date().getFullYear() - (S.profile.birthYear||1995);

// 直近の体重（指定日以前で最も新しいもの）
E.latestWeight = (date)=>{
  const ds = sortedDays().filter(d=>d<=date && S.days[d].weight);
  return ds.length ? S.days[ds[ds.length-1]].weight : null;
};
E.latestBf = (date)=>{
  const ds = sortedDays().filter(d=>d<=date && S.days[d].bodyFat);
  return ds.length ? S.days[ds[ds.length-1]].bodyFat : null;
};

/* 体重の測定頻度まわり
   毎朝測るなら「7日移動平均」、週1回なら「直近4回の平均」で均す。
   週1では日々の水分・便・塩分によるブレ（±1kg）を平均化できないため、
   1点で判断せず複数回の平均と長めの期間で傾きを見る。 */
E.isWeekly    = ()=> (S.profile.weighFreq||'daily') === 'weekly';
E.weighWindow = ()=> E.isWeekly() ? 4 : 7;                       // 移動平均に使う「測定回数」
E.trendSpan   = ()=> E.isWeekly() ? 56 : 14;                     // 傾きを見る日数
E.maLabel     = ()=> E.isWeekly() ? '直近4回の平均' : '7日移動平均';
E.isWeighDay  = (date)=> !E.isWeekly() || parseYmd(date).getDay() === (S.profile.weighDay!=null?S.profile.weighDay:2);
E.nextWeighDay = (date)=>{
  if(!E.isWeekly()) return date;
  const target = S.profile.weighDay!=null ? S.profile.weighDay : 2;
  for(let i=0;i<8;i++){ const d = addDays(date,i); if(parseYmd(d).getDay()===target) return d; }
  return date;
};

// 体重の移動平均系列 [{date, raw, ma}]
E.weightSeries = (n)=>{
  n = n || E.weighWindow();
  const pts = sortedDays().filter(d=>S.days[d].weight).map(d=>({date:d, raw:S.days[d].weight}));
  return pts.map((p,i)=>{
    const win = pts.slice(Math.max(0,i-n+1), i+1);
    return {date:p.date, raw:p.raw, ma: win.reduce((a,b)=>a+b.raw,0)/win.length};
  });
};

// 最小二乗で傾き（kg/日）を出す。points:[{date,ma}]
E.slopePerDay = (pts)=>{
  if(pts.length<3) return null;
  const x0 = parseYmd(pts[0].date).getTime()/86400000;
  let sx=0,sy=0,sxx=0,sxy=0;
  pts.forEach(p=>{
    const x = parseYmd(p.date).getTime()/86400000 - x0, y = p.ma;
    sx+=x; sy+=y; sxx+=x*x; sxy+=x*y;
  });
  const n=pts.length, den = n*sxx - sx*sx;
  if(Math.abs(den) < 1e-9) return null;
  return (n*sxy - sx*sy)/den;
};

// 直近 days 日のトレンド（kg/週）
E.weightTrend = (date, days)=>{
  const explicit = days != null;
  days = days || E.trendSpan();
  const calc = (span)=>{
    const from = addDays(date, -span+1);
    const pts = E.weightSeries().filter(p=>p.date>=from && p.date<=date);
    const sl = E.slopePerDay(pts);
    return sl==null ? null : {perWeek: sl*7, perDay: sl, points: pts.length, span};
  };
  let r = calc(days);
  // 測定が飛んでいて点が足りないときは、期間を広げて拾い直す
  if(!r && !explicit) r = calc(56);
  if(!r && !explicit) r = calc(120);
  return r;
};

E.bmi = (date, w)=>{
  const hm = (S.profile.height||170)/100;
  w = w || E.latestWeight(date||VIEW_DATE);
  return w ? w/(hm*hm) : null;
};

// 直近で記録された体重計の値（指定日以前）
E.latestOf = (date, key)=>{
  const ds = sortedDays().filter(d=>d<=date && S.days[d][key]!=null);
  return ds.length ? S.days[ds[ds.length-1]][key] : null;
};

E.bmr = (w)=>{
  const p=S.profile; w = w||E.latestWeight(VIEW_DATE)||p.goalWeight;
  // 体重計が基礎代謝を出しているなら実測を優先する（体組成を踏まえた値のため計算式より個人差を反映する）
  const scale = E.latestOf(VIEW_DATE, 'bmrScale');
  if(scale && scale > 800 && scale < 3000) return Math.round(scale);
  const base = 10*w + 6.25*p.height - 5*E.age();
  return Math.round(base + (p.sex==='female' ? -161 : 5));
};
E.tdeeStatic = (w)=> Math.round(E.bmr(w)*(S.profile.activity||1.45));

// 実測ベースの適応TDEE：平均摂取 − 体重変化から逆算（脂肪1kg≒7200kcal）
E.tdeeAdaptive = (date)=>{
  const weekly = E.isWeekly();
  const win = weekly ? 56 : 21;                 // 週1測定では期間を長く取らないと傾きが出ない
  const rows = daysUpTo(date, win).filter(d=>d.kcal);
  if(rows.length < (weekly ? 14 : 10)) return null;
  const trend = E.weightTrend(date, win);
  if(!trend || trend.points < (weekly ? 4 : 8)) return null;
  const avgKcal = rows.reduce((a,b)=>a+b.kcal,0)/rows.length;
  const tdee = avgKcal - (trend.perDay * 7200);
  if(!isFinite(tdee) || tdee < 1000 || tdee > 5500) return null;
  return {value: Math.round(tdee), days: rows.length, avgKcal: Math.round(avgKcal)};
};

/* -------- その日の活動量（立ち仕事・歩数・ウォーキング・筋トレ） --------
   正味の消費 = (METs − 1.3) × 体重 × 時間。1.3＝座って過ごした場合で、「その時間を座っていたら」との差を出す。
   勤務時間が未入力の日は区分ごとの標準時間で仮定し、画面に「仮定」と出す。 */
const SHIFT_STD_H = {work:8, wedding:10, allnight:14};
const CARDIO_METS = {'ウォーキング':3.5, '早歩き（速歩）':4.3, '階段のぼり':4.0};
const KCAL_PER_STEP = 0.00055;   // 1歩あたり kcal/kg（70kgで1,000歩≒38kcal）
const toMin = t => { const [h,m] = String(t).split(':').map(Number); return h*60+(m||0); };
E.shiftOf = (date)=>{ const r = S.days[date]; return r && r.shift ? r.shift : (E.isOffDay(date) ? 'off' : null); };
E.activity = (date)=>{
  const p = S.profile, rec = S.days[date], w = E.latestWeight(date) || p.goalWeight;
  const shift = E.shiftOf(date), steps = rec && rec.steps!=null ? rec.steps : null;
  const out = {date, shift, steps, parts:[], total:0, standH:0, assumed:false};
  // 立ち仕事
  if(shift && shift!=='off'){
    let dur = null;
    if(rec && rec.workStart && (rec.workEnd||rec.homeTime)){
      dur = toMin(rec.workEnd||rec.homeTime) - toMin(rec.workStart); if(dur<=0) dur += 1440; dur /= 60;
      if(dur > 6) dur -= 1;                                  // 休憩1時間
    }else{ dur = SHIFT_STD_H[shift] || 8; out.assumed = true; }
    const ratio = (shift==='wedding' ? (p.standWedding??85) : (p.standWork??60)) / 100;
    const h = dur * ratio;
    // 歩数があれば移動は歩数で数えるので「立っているだけ」、無ければ移動込みの値
    const mets = steps!=null ? 2.0 : shift==='wedding' ? 3.0 : 2.5;
    const kcal = Math.round((mets-1.3) * w * h);
    out.standH = h; out.workH = dur; out.ratio = ratio;
    out.parts.push({k:'stand', l:`立ち仕事 ${r1(h)}h${out.assumed?'（勤務時間が未入力のため仮定）':''}`, kcal});
  }
  // 歩数
  if(steps!=null){ out.parts.push({k:'steps', l:`${steps.toLocaleString()}歩`, kcal: Math.round(steps*KCAL_PER_STEP*w)}); }
  // トレーニングの記録（有酸素は分、筋トレはセット数×3分）
  let sets = 0, skipped = 0;
  S.workouts.filter(x=>x.date===date).forEach(wo=>(wo.exercises||[]).forEach(ex=>{
    const meta = E.exMeta(ex.name);
    if(meta.m===CARDIO){
      const min = (ex.sets||[]).reduce((a,b)=>a+(b.reps||0),0); if(!min) return;
      if(steps!=null && /ウォーキング|早歩き/.test(ex.name)){ skipped += min; return; }   // 歩数に含まれている
      const kcal = Math.round(((CARDIO_METS[ex.name]||4.0)-1.3) * w * min/60);
      out.parts.push({k:'cardio', l:`${ex.name} ${min}分`, kcal});
    }else sets += (ex.sets||[]).filter(x=>x.reps>0).length;
  }));
  if(sets) out.parts.push({k:'train', l:`筋トレ ${sets}セット`, kcal: Math.round((3.5-1.3) * w * sets*3/60)});
  if(skipped) out.note = `ウォーキング${skipped}分は歩数に含まれるので二重に数えていません`;
  out.total = out.parts.reduce((a,b)=>a+b.kcal,0);
  return out;
};
// ふだん（直近28日の記録がある日）の平均。目標の増減はこの平均との差で行う＝週の合計は変わらない
E.activityBase = (date)=>{
  const xs = [];
  for(let i=1;i<=28;i++){ const d = addDays(date,-i); if(S.days[d] || S.workouts.some(x=>x.date===d)) xs.push(E.activity(d).total); }
  return xs.length >= 7 ? {avg: xs.reduce((a,b)=>a+b,0)/xs.length, n: xs.length} : null;
};
// 脚の疲れ：立ち時間と歩数から。トレーニングは勤務の前後どちらもあるので今日と前日の重いほうを使う
E.legLoad = (date)=>{
  const idx = (d)=>{
    const a = E.activity(d), sh = a.shift;
    const st = a.steps!=null ? a.steps/10000 : sh==='wedding' ? 1.0 : (sh==='work'||sh==='allnight') ? 0.6 : 0.3;
    return {v: a.standH/8 + st, a};
  };
  const t = idx(date), y = idx(addDays(date,-1));
  const v = Math.max(t.v, y.v*0.8), src = t.v >= y.v*0.8 ? '今日' : '前日';
  const a = src==='今日' ? t.a : y.a;
  const why = `${src}の${a.standH?`立ち仕事 ${r1(a.standH)}h`:''}${a.standH&&a.steps!=null?'・':''}${a.steps!=null?`${a.steps.toLocaleString()}歩`:''}`;
  return {level: v>=2.4 ? 'very' : v>=1.8 ? 'tired' : 'ok', v, why};
};

// 今日の目標値
E.targets = (date)=>{
  const p = S.profile;
  const w = E.latestWeight(date) || p.goalWeight;
  const ad = E.tdeeAdaptive(date);
  const tdee = ad ? ad.value : E.tdeeStatic(w);
  let kcal;
  if(p.goalType==='cut')       kcal = Math.round(tdee * 0.82);   // −18%：筋量を守れる減量幅
  else if(p.goalType==='bulk') kcal = Math.round(tdee * 1.10);
  else                         kcal = Math.round(tdee * 0.97);   // recomp
  // カロリーサイクリング：その日の活動量と、ふだんの平均との差で増減させる（週の合計は変えない）
  let cycle = null;
  const actBase = p.calCycle ? E.activityBase(date) : null;
  if(actBase){
    const act = E.activity(date), diff = act.total - actBase.avg;
    // 差の半分だけ動かす（全部合わせると休みの日が削れすぎる。体は数日単位で帳尻を合わせる）。基礎代謝は下回らない
    const mult = clamp(1 + diff*0.5/tdee, 0.9, 1.15);
    kcal = Math.max(Math.round(kcal*mult), Math.round(E.bmr(w)));
    cycle = {mult, act, base: Math.round(actBase.avg), diff: Math.round(diff),
      why: act.parts.length ? act.parts.map(x=>x.l.replace(/（.*）/,'')).join('・') : '活動の記録なし'};
  }else if(p.calCycle){
    // 記録が7日たまるまでは、勤務区分とトレーニング有無で大まかに増減する
    const rec = S.days[date];
    const shift = rec && rec.shift ? rec.shift : (E.isOffDay(date) ? 'off' : null);
    const trained = S.workouts.some(x=>x.date===date);
    const load = shift ? (SHIFTS.find(s=>s.k===shift)||{load:1}).load : 1;
    let mult = 1, why = '通常';
    if(load>=2 || (load>=1 && trained)){ mult = 1.08; why = trained? '勤務＋トレーニング' : '立ち仕事の長い日'; }
    else if(load===0 && !trained){ mult = 0.92; why = '休みでトレーニングなし'; }
    else if(load===0 && trained){ mult = 1.05; why = '休み＋トレーニング'; }
    kcal = Math.round(kcal*mult);
    cycle = {mult, why, rough:true};
  }
  const protein = Math.round(w * p.proteinPerKg);
  const fat     = Math.round(w * p.fatPerKg);
  const carb    = Math.max(30, Math.round((kcal - protein*4 - fat*9)/4));
  return {
    tdee, adaptive: !!ad, adaptiveInfo: ad, kcal, protein, fat, carb, cycle,
    water: Math.round(w * p.waterPerKg), sleep: p.sleepTarget, steps: p.stepTarget, weight: w
  };
};

/* -------- 食事の検索・記録 -------- */
// カタカナ→ひらがなに寄せて、かな入力でも引っかかるようにする
const kana = s => String(s||'').replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60)).toLowerCase();

E.allFoods = ()=> (S.myFoods||[]).concat(FOODS);

E.foodSearch = (q)=>{
  const qq = kana(q).trim();
  if(!qq) return [];
  const terms = qq.split(/\s+/).filter(Boolean);
  return E.allFoods().filter(f=>{
    const hay = kana(f.n)+' '+kana(f.r||'')+' '+kana(f.g||'');
    return terms.every(t=> hay.indexOf(t) >= 0);
  }).slice(0,14);
};

// よく食べるもの（直近60日の登録回数順）
E.freqFoods = (date)=>{
  const cnt = {};
  sortedDays().filter(d=>d<=date).slice(-60).forEach(d=>{
    (S.days[d].meals||[]).forEach(m=>{ cnt[m.name] = (cnt[m.name]||0)+1; });
  });
  return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,8)
    .map(n=> E.allFoods().find(f=>f.n===n)).filter(Boolean);
};

E.mealTotals = (d, slot)=>{
  const t = {k:0,p:0,f:0,c:0};
  (d.meals||[]).filter(m=> !slot || m.slot===slot).forEach(m=>{
    t.k += m.k*m.q; t.p += m.p*m.q; t.f += m.f*m.q; t.c += m.c*m.q;
  });
  return {kcal:Math.round(t.k), protein:Math.round(t.p), fat:Math.round(t.f), carb:Math.round(t.c)};
};

// 食事リストがあるときは、その合計をその日のPFC・カロリーに反映する
E.syncMeals = (d)=>{
  if(!(d.meals||[]).length) return false;
  const t = E.mealTotals(d);
  d.kcal = t.kcal; d.protein = t.protein; d.fat = t.fat; d.carb = t.carb;
  return true;
};

/* -------- 栄養素14項目の評価（塩梅 ANBAI を統合） --------
   エネルギーとPFCの目標は E.targets（実測TDEE・カロリーサイクリング・体重×g/kg）をそのまま使う。
   ビタミン・ミネラル・食物繊維・塩分は「日本人の食事摂取基準（2020年版）」の推奨量・目安量・目標量。 */
const NUT_K = ['k','p','f','c','sf','fb','s','ca','fe','a','e','b1','b2','vc'];
const MICRO_K = NUT_K.slice(4);                       // MICRO の並び
const NUT_L = {k:'エネルギー',p:'タンパク質',f:'脂質',c:'炭水化物',sf:'飽和脂肪酸',fb:'食物繊維',s:'塩分',
  ca:'カルシウム',fe:'鉄',a:'ビタミンA',e:'ビタミンE',b1:'ビタミンB1',b2:'ビタミンB2',vc:'ビタミンC'};
const NUT_U = {k:'kcal',p:'g',f:'g',c:'g',sf:'g',fb:'g',s:'g',ca:'mg',fe:'mg',a:'µg',e:'mg',b1:'mg',b2:'mg',vc:'mg'};
const NUT_D = {k:0,p:0,f:0,c:0,sf:1,fb:1,s:1,ca:0,fe:1,a:0,e:1,b1:2,b2:2,vc:0};
const NUT_W = {k:15,p:10,f:8,c:8, sf:6,s:6,fb:6, ca:6,fe:6,a:6,e:5,b1:6,b2:6,vc:6};   // 合計100
const NUT_NEED = ['fb','ca','fe','a','e','b1','b2','vc'];
const NUT_DRI = {   // 18〜29 / 30〜49 / 50〜64歳。65歳以上は50〜64歳の値で代用。女性の鉄は月経ありの値
  m:{18:{ca:800,fe:7.5,a:850,e:6.0,b1:1.4,b2:1.6,vc:100,fb:21,s:7.5},
     30:{ca:750,fe:7.5,a:900,e:6.0,b1:1.4,b2:1.6,vc:100,fb:21,s:7.5},
     50:{ca:750,fe:7.5,a:900,e:7.0,b1:1.3,b2:1.5,vc:100,fb:21,s:7.5}},
  f:{18:{ca:650,fe:10.5,a:650,e:5.0,b1:1.1,b2:1.2,vc:100,fb:18,s:6.5},
     30:{ca:650,fe:10.5,a:700,e:5.5,b1:1.1,b2:1.2,vc:100,fb:18,s:6.5},
     50:{ca:650,fe:11.0,a:700,e:6.0,b1:1.1,b2:1.2,vc:100,fb:18,s:6.5}},
};
const nfmt = (k,v)=> (Math.round(v*10**NUT_D[k])/10**NUT_D[k]).toLocaleString('ja-JP',{minimumFractionDigits:NUT_D[k],maximumFractionDigits:NUT_D[k]});

// 食品・記録1件の微量栄養素（不明は null。0とは数えない）
E.microOf = (x)=>{
  if(x.m) return x.m;
  const m = MICRO[x.name||x.n];
  return m ? m.slice(0,10) : null;
};
E.vecOf = (x)=>{
  const q = x.q==null ? 1 : x.q, mm = E.microOf(x);
  const v = {k:(x.k||0)*q, p:(x.p||0)*q, f:(x.f||0)*q, c:(x.c||0)*q};
  MICRO_K.forEach((k,i)=>{ const y = mm ? mm[i] : null; v[k] = y==null ? null : y*q; });
  return v;
};
E.nTargets = (date)=>{
  const t = E.targets(date), age = E.age(), band = age<30?18:age<50?30:50;
  const dri = NUT_DRI[S.profile.sex==='female'?'f':'m'][band];
  return Object.assign({k:t.kcal, p:t.protein, f:t.fat, c:t.carb, sf:t.kcal*0.07/9}, dri);
};
// その日の合計。unk[k] は「その栄養素が不明な品目」のカロリー比率
E.nutri = (date)=>{
  const d = S.days[date], meals = (d && d.meals) || [];
  const tot = {}, unkK = {}; NUT_K.forEach(k=>{ tot[k]=0; unkK[k]=0; });
  const unkItems = [];
  meals.forEach(m=>{
    const v = E.vecOf(m);
    NUT_K.forEach(k=>{ if(v[k]==null) unkK[k] += v.k; else tot[k] += v[k]; });
    if(v.ca==null) unkItems.push(m.name);
  });
  const unk = {}; NUT_K.forEach(k=> unk[k] = tot.k>0 ? unkK[k]/tot.k : 0);
  const main = ['朝','昼','夕'].filter(s=>meals.some(m=>m.slot===s));
  return {tot, unk, unkItems:[...new Set(unkItems)], n:meals.length, main, partial: main.length<3};
};
// 達成度 s(0..1) と状態 ok/low/over/na
E.nJudge = (k, val, T, unk)=>{
  const r = val / T[k];
  // 内訳が不明な品目が多いとき：分かっている分だけで結論が出る場合（もう足りている／もう超えている）以外は判定しない
  if(unk && unk[k] > 0.25){
    if((k==='sf'||k==='s') && r>1) return {s:clamp(2-r,0,1), st:'over', r, lb:true};
    if(NUT_NEED.includes(k) && r>=1) return {s:1, st:'ok', r, lb:true};
    return {s:0, st:'na', r, lb:true};
  }
  if(k==='k'){ return {s: r>=0.9&&r<=1.1 ? 1 : r<0.9 ? clamp((r-0.5)/0.4,0,1) : clamp((1.5-r)/0.4,0,1),
    st: r<0.9?'low':r>1.1?'over':'ok', r}; }
  if(k==='p'){ // 筋肉を守るため多めは許容。1.6倍を超えたら過多
    if(r<0.9) return {s:clamp((r-0.5)/0.4,0,1), st:'low', r};
    return r>1.6 ? {s:clamp(1-(r-1.6)/0.8,0,1), st:'over', r} : {s:1, st:'ok', r}; }
  if(k==='f'||k==='c'){
    if(r<0.8) return {s:clamp((r-0.4)/0.4,0,1), st:'low', r};
    return r>1.2 ? {s:clamp(1-(r-1.2)/0.5,0,1), st:'over', r} : {s:1, st:'ok', r}; }
  if(k==='sf'||k==='s') return {s: r<=1 ? 1 : clamp(2-r,0,1), st: r<=1?'ok':'over', r};
  return {s:Math.min(1,r), st: r>=1?'ok':'low', r};
};
E.nScore = (N, T)=>{
  let sc = 0, w = 0;
  NUT_K.forEach(k=>{ const j = E.nJudge(k, N.tot[k], T, N.unk); if(j.st==='na') return; sc += j.s*NUT_W[k]; w += NUT_W[k]; });
  return w ? Math.round(sc/w*100) : 0;
};
// その日の食事で値の大きい順
E.nTop = (date, k, n)=>{
  const d = S.days[date]; if(!d) return [];
  return (d.meals||[]).map(m=>({n:m.name, v:E.vecOf(m)[k]||0})).filter(x=>x.v>0)
    .sort((a,b)=>b.v-a.v).slice(0, n||2).map(x=>x.n);
};
// 足りない分を、残りのカロリー枠で埋められる食品
E.nSuggest = (N, T)=>{
  const tot = N.tot, kcap = Math.max(T.k - tot.k, 120);
  const okGroup = f=> !['調味料','飲料','間食'].includes(f.g) || /野菜ジュース|オレンジ|ナッツ|アーモンド|プロテイン/.test(f.n);
  const res = E.allFoods().filter(f=>okGroup(f) && E.microOf(f)).map(f=>{
    const v = E.vecOf(f); let gain = 0; const hits = [];
    NUT_NEED.concat('p').forEach(k=>{
      if(N.unk[k] > 0.25) return;
      const def = Math.max(0, T[k]-tot[k]) / T[k]; if(def<=0) return;
      const g = Math.min(v[k]/T[k], def); gain += g; if(g>=0.15) hits.push([k,g]);
    });
    // 罰点はその食品が「新たに」上乗せする超過分だけ（すでに超えている分は全候補に共通なので数えない）
    const add = (k)=> (Math.max(0, tot[k]+(v[k]||0)-T[k]) - Math.max(0, tot[k]-T[k])) / T[k];
    let pen = add('s')*1.5 + add('sf');
    if(v.k > kcap) pen += (v.k-kcap)/T.k*4;
    return {f, val:gain-pen, hits:hits.sort((a,b)=>b[1]-a[1])};
  }).filter(x=>x.val>0.12 && x.hits.length).sort((a,b)=>b.val-a.val);
  const out = [], seen = new Set();
  for(const x of res){ if(seen.has(x.f.g) && out.length<2) continue; out.push(x); seen.add(x.f.g); if(out.length>=3) break; }
  return out;
};
// 食事タブに出す、その日のコメント
E.nAdvice = (date, N, T)=>{
  const A = [], tot = N.tot, top = (k)=>E.nTop(date,k,2).map(x=>`「${x}」`).join('');
  if(!N.n) return A;
  if(N.partial){
    A.push({t:'good', h:`残り ${nfmt('k',Math.max(0,T.k-tot.k))}kcal・タンパク質あと ${nfmt('p',Math.max(0,T.p-tot.p))}g`,
      b:`${['朝','昼','夕'].filter(s=>!N.main.includes(s)).join('・')}がまだです。下の提案はこの残りの枠に収まるように選んでいます。`});
  }else{
    const ek = E.nJudge('k',tot.k,T);
    if(ek.st==='over') A.push({t:'bad', h:`エネルギーが目標より ${nfmt('k',tot.k-T.k)}kcal 多め`, b:`いちばん大きいのは${top('k')}。1日で取り返そうとせず、この先2〜3日で少しずつ戻せば十分です。`});
    if(ek.st==='low')  A.push({t:'warn', h:`エネルギーが ${nfmt('k',T.k-tot.k)}kcal 不足`, b:'削りすぎると筋肉から落ちます。主食かタンパク質をもう一品足しましょう。'});
    if(tot.p < T.p*0.9) A.push({t:'warn', h:`タンパク質が不足（${nfmt('p',tot.p)}g / 目標 ${T.p}g）`, b:'サラダチキン・卵・納豆・ギリシャヨーグルト・プロテインなど、調理なしで足せるものが手軽です。'});
  }
  if(N.unk.s<=0.25 && tot.s > T.s) A.push({t:'bad', h:`塩分 ${nfmt('s',tot.s)}g（目標 ${T.s}g未満）`,
    b:`多いのは${top('s')}。麺や汁物の汁を半分残す、しょうゆはかけずにつける、で1〜2g減らせます。塩分が多い日の翌朝は顔がむくみやすくなります。`});
  if(N.unk.sf<=0.25 && tot.sf > T.sf) A.push({t:'bad', h:`飽和脂肪酸が多め（${nfmt('sf',tot.sf)}g / 目標 ${nfmt('sf',T.sf)}g以下）`,
    b:`主な出どころは${top('sf')}。肉は脂身の少ない部位（むね・ささみ・ヒレ・もも）に替えると、タンパク質を保ったまま減らせます。`});
  if(!N.partial){
    const lows = NUT_NEED.filter(k=>N.unk[k]<=0.25).map(k=>[k, tot[k]/T[k]]).filter(x=>x[1]<0.7).sort((a,b)=>a[1]-b[1]).slice(0,3);
    if(lows.length) A.push({t:'warn', h:`不足：${lows.map(x=>NUT_L[x[0]]).join('・')}`,
      b: lows.map(x=>`${NUT_L[x[0]]}は目標の${Math.round(x[1]*100)}%`).join('、') + '。下の一品で補えます。'});
    if(!A.some(a=>a.t==='bad') && E.nScore(N,T)>=85) A.unshift({t:'good', h:'いい塩梅です', b:'エネルギー・PFC・ビタミン・ミネラルのバランスがとれています。'});
  }
  return A;
};
// 直近7日の傾向（ホームのアドバイス用）。朝昼夕がそろった日だけで平均する
E.nWeek = (date)=>{
  const rows = [];
  for(let i=0;i<7;i++){ const ds = addDays(date,-i), N = E.nutri(ds); if(!N.partial) rows.push({ds, N}); }
  if(rows.length < 3) return null;
  const T = E.nTargets(date), avg = {};
  NUT_K.forEach(k=>{
    const ok = rows.filter(r=>r.N.unk[k]<=0.25);
    avg[k] = ok.length>=3 ? ok.reduce((a,r)=>a+r.N.tot[k],0)/ok.length : null;
  });
  return {days: rows.length, avg, T};
};

/* -------- トレーニング -------- */
E.e1rm = (w, reps)=> (w>0 && reps>0) ? w * (1 + reps/30) : 0;   // Epley
E.exMeta = (name)=> EXERCISES.find(e=>e.n===name) || {n:name, m:'その他', t:'other', c:0};

E.workoutsIn = (from, to)=> S.workouts.filter(w=> w.date>=from && w.date<=to);

// 有効セット数（重量×回数が入っていて 1〜30レップのもの）
E.countSets = (ws)=>{
  const vol = {}; MUSCLES.forEach(m=>vol[m]=0);
  let push=0, pull=0, tonnage=0, total=0;
  ws.forEach(w=>(w.exercises||[]).forEach(ex=>{
    const meta = E.exMeta(ex.name);
    if(meta.m === CARDIO) return;             // ウォーキング等は筋トレのボリュームに含めない
    (ex.sets||[]).forEach(s=>{
      if(!(s.reps>0)) return;
      if(!(s.w>0) && meta.m!=='体幹') return;
      total++;
      if(vol[meta.m]!=null) vol[meta.m]++;
      if(meta.t==='push') push++; else if(meta.t==='pull') pull++;
      tonnage += (s.w||0)*s.reps;
    });
  }));
  return {vol, push, pull, tonnage: Math.round(tonnage), total, sessions: ws.length};
};

E.weekVolume = (date)=>{
  const start = isoWeekStart(date), end = addDays(start, 6);
  return Object.assign({start, end}, E.countSets(E.workoutsIn(start, end)));
};

/* -------- 不規則シフト対応：ローリング管理とセッション生成 -------- */

E.isOffDay = (date)=> (S.profile.offDays||[]).includes(parseYmd(date).getDay());

// 使える種目（器具設定でフィルタ）
E.pool = ()=>{
  const eq = S.profile.equipment||'home';
  if(eq==='gym')  return EXERCISES;
  if(eq==='body') return EXERCISES.filter(e=>e.eq==='bw');
  return EXERCISES.filter(e=>e.eq!=='gym');           // home
};

// 見た目への効きを踏まえた、限られたセット数の配分比率
const VOL_SHARE = {'肩':0.20, '背中':0.20, '胸':0.16, '脚':0.16, '腕':0.14, '体幹':0.14};

// 14日間に現実的にこなせるセット数（定休日のメイン＋勤務日の補填から逆算）
E.capacity14 = ()=>{
  const p = S.profile;
  const offs = (p.offDays||[]).length;
  const mainPerWeek = offs>=2 ? 22+15 : offs===1 ? 22 : 0;      // 75分＋45分
  const extra = (p.extraPerWeek!=null ? p.extraPerWeek : 1) * 7; // 20分の補填
  let cap = (mainPerWeek + extra) * 2;
  if(p.mode==='maintain') cap = Math.round(cap*0.45);
  return Math.max(12, cap);
};

// 14日あたりの目標セット数＝「エビデンス上の理想」と「スケジュール上の現実」の小さいほう
E.volTarget14 = (m)=>{
  const std = VOL_TARGET[m], k = S.profile.mode==='maintain' ? 0.45 : 1;
  const ideal = Math.round(std.min*2*k);
  const real  = Math.round(E.capacity14()*(VOL_SHARE[m]||0.15));
  return {min: Math.max(2, Math.min(ideal, real)), max: Math.round(std.max*2*k)};
};

// 直近14日のボリューム（暦の週ではなくローリングで見る）
E.rolling = (date, days)=>{
  days = days||14;
  return Object.assign({from:addDays(date,-days+1), to:date},
    E.countSets(E.workoutsIn(addDays(date,-days+1), date)));
};

// 部位別の「負債」＝14日目標に対する不足分
E.debt = (date)=>{
  const r = E.rolling(date, 14);
  return MUSCLES.map(m=>{
    const t = E.volTarget14(m), s = r.vol[m]||0;
    return {m, sets:s, target:t.min, max:t.max, lack: Math.max(0, t.min-s), ratio: t.min? s/t.min : 1};
  }).sort((a,b)=> a.ratio - b.ratio);
};

// 連勤日数
E.consecWork = (date)=>{
  let n=0, d=date;
  for(let i=0;i<14;i++){
    const rec = S.days[d];
    const off = rec ? rec.shift==='off' : E.isOffDay(d);
    if(off) break;
    n++; d = addDays(d,-1);
  }
  return n;
};

// 退勤時刻（未入力なら旧データの帰宅時刻を使う）
E.endTime = (rec)=> rec ? (rec.workEnd || rec.homeTime || '') : '';

// 回復状態：睡眠・前日の退勤時刻・前日の勤務内容から、その日に許容できる強度を決める
E.recovery = (date)=>{
  const y = S.days[addDays(date,-1)], today = S.days[date];
  const reasons = [];
  let level = 'ok';

  const sleep = (today && today.sleepH!=null) ? today.sleepH : (y && y.sleepH!=null ? y.sleepH : null);
  if(sleep!=null && sleep < 6){ level='low'; reasons.push(`睡眠 ${r1(sleep)}h`); }
  if(sleep!=null && sleep < 5){ level='bad'; }

  const et = E.endTime(y);
  if(et){
    const hh = parseInt(et.split(':')[0],10);
    const late = S.profile.lateHour||23;
    if(hh>=late || hh<5){ if(level==='ok') level='low'; reasons.push(`前日の退勤 ${et}`); }
  }

  const yShift = y && y.shift, tShift = today && today.shift;
  if(yShift==='allnight' || tShift==='allnight'){ level='bad'; reasons.push('徹夜明け'); }
  else if(yShift==='wedding'){ if(level==='ok') level='low'; reasons.push('前日が挙式'); }
  if(tShift==='wedding'){ if(level==='ok') level='low'; reasons.push('今日は挙式'); }

  return {level, reasons, sleep};
};

// その日の位置づけ（定休日＝メイン、勤務日＝補填）
E.dayPlan = (date)=>{
  const offs = (S.profile.offDays||[]).slice().sort();
  const dow = parseYmd(date).getDay();
  if(offs.length>=2){
    if(dow===offs[0]) return {type:'upper', label:'メイン① 上半身', minutes:75};
    if(dow===offs[1]) return {type:'lower', label:'メイン② 下半身＋弱点', minutes:45};
  }else if(offs.length===1 && dow===offs[0]){
    return {type:'full', label:'メイン 全身', minutes:75};
  }
  return {type:'topup', label:'補填（負債の大きい部位だけ）', minutes:20};
};

const MUSCLE_ORDER = {
  upper:['背中','胸','肩','腕','体幹'],
  lower:['脚','体幹','肩','背中'],
  full: ['脚','背中','胸','肩','腕','体幹'],
  topup:[]
};

// 直近に実施した日（種目のローテーションに使用）
E.lastDone = ()=>{
  const map = {};
  S.workouts.forEach(w=>(w.exercises||[]).forEach(ex=>{
    if(!map[ex.name] || map[ex.name] < w.date) map[ex.name] = w.date;
  }));
  return map;
};

// 持ち時間に割り当てられたテンプレート
E.templateFor = (minutes)=> (S.templates||[]).find(t=> +t.min === +minutes) || null;

/* 今日のメニューを生成する
   minutes: 20 / 45 / 75
   opts.forceAuto: true で、テンプレートを無視して自動生成する */
E.suggestSession = (date, minutes, opts)=>{
  opts = opts||{};
  const plan = E.dayPlan(date), rec = E.recovery(date), debt = E.debt(date);
  const pool = E.pool(), last = E.lastDone();
  const warnings = [];

  // 時間からセット数の予算を決める（インターバル込みで1セット≒2.5〜3.5分）
  let budget = minutes>=75 ? 22 : minutes>=45 ? 15 : 7;
  if(rec.level==='low'){ budget = Math.round(budget*0.75); warnings.push('回復が落ちているためセット数を25%減らしています'); }
  if(rec.level==='bad'){ budget = Math.round(budget*0.5);  warnings.push('睡眠不足が深刻です。今日は「やらないよりマシ」の量に留めます'); }
  const rpeCap = rec.level==='ok' ? 9 : rec.level==='low' ? 8 : 7;
  // 立ち仕事・歩行で脚が疲れている日は脚の量を減らす（very＝休ませる、tired＝1種目2セットまで）
  const legs = E.legLoad(date);
  const legWarn = ()=> warnings.push(legs.level==='very'
    ? `${legs.why}で脚が疲れているため、今日は脚を休ませて他の部位に回します`
    : `${legs.why}で脚に疲れが残っているため、脚は1種目2セットまでにしています`);

  /* --- 回復が底のときは筋トレをやめてウォーキングに置き換える --- */
  if(rec.level === 'bad'){
    return {
      date, minutes, plan, rec, source:'recovery',
      warnings:['睡眠不足や徹夜明けで回復が底です。今日は筋トレではなく歩くだけにします'],
      rpeCap: 6,
      items:[{name:'ウォーキング', muscle:CARDIO, sets:1, w:null,
        target:`${Math.min(40, Math.max(15, minutes))}分 ゆっくり`,
        why:'血流を上げて回復を促す目的。追い込む日ではありません', note:'', rpe:6}],
      debtTop: debt.filter(d=>d.lack>0).slice(0,3),
      estMin: Math.min(40, Math.max(15, minutes))
    };
  }

  /* --- 持ち時間にテンプレートが設定されていればそれを使う --- */
  const tpl = opts.forceAuto ? null : E.templateFor(minutes);
  if(tpl){
    const items = [];
    let left = budget, dropped = 0, legN = 0;
    if(legs.level!=='ok' && tpl.exercises.some(x=>E.exMeta(x.name).m==='脚')) legWarn();
    tpl.exercises.forEach(item=>{
      const meta = E.exMeta(item.name);
      if(left < 2){ dropped++; return; }
      if(meta.m==='脚' && (legs.level==='very' || (legs.level==='tired' && legN>=1))) return;
      if(meta.m==='脚') legN++;
      const sets = Math.min(item.n||3, left, meta.m==='脚' && legs.level==='tired' ? 2 : 99);
      left -= sets;
      const sug = E.nextSuggestion(item.name);
      items.push({
        name:item.name, muscle:meta.m, sets, w: sug?sug.w:null,
        target: sug ? sug.text : '初回：フォームを確認できる重さで 10〜12回',
        why: sug ? sug.why : '記録がないので基準づくりの回',
        note: (rec.level!=='ok' && meta.c && /デッドリフト|スクワット/.test(item.name)) ? '疲労時は腰への負担が大きいので重量を落とす' : '',
        rpe: rpeCap
      });
    });
    if(dropped) warnings.push(`時間内に収めるため後半の${dropped}種目を省いています`);
    return {
      date, minutes, plan, rec, warnings, items, rpeCap,
      source:'template', tplName: tpl.name,
      debtTop: debt.filter(d=>d.lack>0).slice(0,3),
      estMin: Math.round(items.reduce((a,b)=>a+b.sets,0)*3)
    };
  }

  // 部位の優先順位：メイン日は型どおり、補填日は負債の大きい順
  let order = MUSCLE_ORDER[plan.type].slice();
  if(plan.type==='topup'){
    order = debt.filter(d=>d.lack>0).map(d=>d.m).slice(0,3);
    if(!order.length) order = ['肩','背中'];      // 負債ゼロなら見た目に効く部位を回す
  }else{
    // 型のなかでも負債の大きい部位を前に出す。ただし主役の部位は必ず最初、体幹は最後
    order.sort((a,b)=> debt.find(d=>d.m===a).ratio - debt.find(d=>d.m===b).ratio);
    const primary = plan.type==='lower' ? '脚' : plan.type==='full' ? '脚' : null;
    if(primary && order.includes(primary)) order = [primary].concat(order.filter(m=>m!==primary));
    if(order.includes('体幹')) order = order.filter(m=>m!=='体幹').concat(['体幹']);
  }

  if(legs.level!=='ok' && order.includes('脚')) legWarn();
  if(legs.level==='very'){
    order = order.filter(m=>m!=='脚');
    if(!order.length) order = debt.filter(d=>d.lack>0 && d.m!=='脚').map(d=>d.m).slice(0,3);
    if(!order.length) order = ['肩','背中'];
  }
  const items = [];
  const usedNames = {};
  let legN = 0;
  const pickFor = (m, preferCompound)=>{
    const cands = pool.filter(e=>e.m===m && !usedNames[e.n]);
    if(!cands.length) return null;
    cands.sort((a,b)=>{
      const ha = last[a.n]?1:0, hb = last[b.n]?1:0;
      if(ha!==hb) return hb-ha;                                       // 実績のある種目を優先（重量が引き継げる）
      if(preferCompound && a.c!==b.c) return b.c-a.c;                 // 時間がない日は複合種目優先
      const la = last[a.n]||'0000-00-00', lb = last[b.n]||'0000-00-00';
      if(la!==lb) return la<lb ? -1 : 1;                              // 実績ありの中では久しぶりのものから
      return b.c-a.c;
    });
    return cands[0];
  };

  let left = budget, i = 0;
  while(left >= 2 && i < 14){
    const m = order[i % order.length];
    const first = i < order.length;
    if(m==='脚' && legs.level==='tired' && legN>=1){ i++; continue; }
    const ex = pickFor(m, left <= 9 || first);
    i++;
    if(!ex) continue;
    usedNames[ex.n] = true;
    const sets = m==='脚' && legs.level==='tired' ? 2 : Math.min(3, left >= 3 ? 3 : 2);
    if(m==='脚') legN++;
    left -= sets;
    const sug = E.nextSuggestion(ex.n);
    const heavy = ex.c && /デッドリフト|スクワット/.test(ex.n);
    items.push({
      name: ex.n, muscle: m, sets, w: sug ? sug.w : null,
      target: sug ? sug.text : '初回：フォームを確認できる重さで 10〜12回',
      why: sug ? sug.why : '記録がないので基準づくりの回',
      note: (rec.level!=='ok' && heavy) ? '疲労時は腰への負担が大きいので重量を落とす' : '',
      rpe: rpeCap
    });
    if(rec.level!=='ok' && heavy && items.length>1){ /* 重い種目は1つまで */ }
  }

  return {
    date, minutes, plan, rec, warnings, items, rpeCap, source:'auto',
    debtTop: debt.filter(d=>d.lack>0).slice(0,3),
    estMin: Math.round(items.reduce((a,b)=>a+b.sets,0)*3)
  };
};

// 種目ごとの推定1RMベスト履歴
E.bests = ()=>{
  const best = {};
  S.workouts.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(w=>(w.exercises||[]).forEach(ex=>{
    (ex.sets||[]).forEach(s=>{
      const v = E.e1rm(s.w, s.reps);
      if(v<=0) return;
      if(!best[ex.name] || v > best[ex.name].e1rm + 0.01){
        best[ex.name] = {e1rm:v, w:s.w, reps:s.reps, date:w.date};
      }
    });
  }));
  return best;
};

// あるワークアウトが自己ベストを更新したか（保存済みデータ基準）
E.prsIn = (from, to)=>{
  const running = {}, prs = [];
  S.workouts.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(w=>(w.exercises||[]).forEach(ex=>{
    (ex.sets||[]).forEach(s=>{
      const v = E.e1rm(s.w, s.reps);
      if(v<=0) return;
      if(!running[ex.name] || v > running[ex.name] + 0.01){
        const first = !running[ex.name];
        running[ex.name] = v;
        if(!first && w.date>=from && w.date<=to) prs.push({name:ex.name, e1rm:v, w:s.w, reps:s.reps, date:w.date});
      }
    });
  }));
  return prs;
};

// 停滞検出：主要種目でN週間ベスト更新なし
E.stalled = (date, weeks)=>{
  weeks = weeks||3;
  const limit = addDays(date, -weeks*7);
  const best = E.bests();
  const recent = {};
  E.workoutsIn(addDays(date,-28), date).forEach(w=>(w.exercises||[]).forEach(ex=>{ recent[ex.name]=true; }));
  return Object.keys(best)
    .filter(n=> recent[n] && E.exMeta(n).c && best[n].date < limit)
    .map(n=>({name:n, since:best[n].date, e1rm:best[n].e1rm}));
};

// 次回の推奨重量（直近セッションの出来から）
E.nextSuggestion = (name)=>{
  const hist = S.workouts.filter(w=>(w.exercises||[]).some(e=>e.name===name)).sort((a,b)=>a.date<b.date?-1:1);
  if(!hist.length) return null;
  const last = hist[hist.length-1];
  const ex = last.exercises.find(e=>e.name===name);
  const done = (ex.sets||[]).filter(s=>s.reps>0);
  if(!done.length) return null;
  const sets = done.filter(s=>s.w>0);
  if(!sets.length){        // バンド・自重は重量ではなく回数で進める
    const topReps = Math.max.apply(null, done.map(s=>s.reps));
    return {w:null, reps:topReps+1, text:`${topReps+1}回以上`, why:'自重・バンドは重量ではなく回数で進める（前回の最高は'+topReps+'回）'};
  }
  const top = sets.reduce((a,b)=> E.e1rm(b.w,b.reps) > E.e1rm(a.w,a.reps) ? b : a);
  const meta = E.exMeta(name);
  const step = meta.c ? (top.w>=60?2.5:2.5) : 1.25;   // コンパウンドは2.5kg刻み、単関節は1.25kg
  if(top.reps >= 12) return {w:r1(top.w+step*2), reps:8, text:`${r1(top.w+step*2)}kg × 8-10回`, why:`前回12回できたので重量を${r1(step*2)}kg上げます`};
  if(top.reps >= 10) return {w:r1(top.w+step),   reps:8, text:`${r1(top.w+step)}kg × 8-10回`,   why:`前回10回できたので重量を${r1(step)}kg上げます`};
  if(top.reps >= 8)  return {w:r1(top.w),        reps:top.reps+1, text:`${r1(top.w)}kg × ${top.reps+1}回以上`, why:`前回は${top.reps}回。同じ重量で1回でも多く`};
  return {w:r1(top.w), reps:Math.max(6,top.reps), text:`${r1(top.w)}kg × ${Math.max(6,top.reps)}回 を維持`, why:'8回できるまで重量は据え置きます'};
};

/* -------- 実施率など -------- */
E.rate = (date, n, fn)=>{
  const rows = daysUpTo(date, n);
  if(!rows.length) return null;
  const ok = rows.filter(fn).length;
  return {rate: ok/rows.length, ok, n: rows.length};
};
E.avg = (date, n, key)=>{
  const rows = daysUpTo(date, n).filter(d=>d[key]!=null && d[key]!=='');
  if(!rows.length) return null;
  return rows.reduce((a,b)=>a+b[key],0)/rows.length;
};
// 直近7日のカロリー収支（1日単位ではなく週単位で帳尻を合わせるための指標）
E.calBalance7 = (date)=>{
  const rows = daysUpTo(date, 7).filter(d=>d.kcal);
  if(rows.length < 3) return null;
  let intake = 0, target = 0;
  rows.forEach(d=>{ intake += d.kcal; target += E.targets(d.date).kcal; });
  return {intake: Math.round(intake), target: Math.round(target), diff: Math.round(intake-target), days: rows.length};
};

E.streak = (date)=>{
  let n=0, d=date;
  while(S.days[d] && (S.days[d].weight || S.days[d].kcal || S.days[d].sleepH)){ n++; d = addDays(d,-1); }
  return n;
};

/* -------- イケメンスコア -------- */
E.score = (date)=>{
  const p = S.profile, t = E.targets(date);
  const parts = [];

  // ① 体組成 30点
  const w = E.latestWeight(date), bf = E.latestBf(date);
  let body = 0, bodyNote = '体重を記録すると算出されます';
  if(w){
    const start = (()=>{ const ds=sortedDays().filter(d=>S.days[d].weight); return ds.length? S.days[ds[0]].weight : w; })();
    const span = Math.abs(start - p.goalWeight);
    const done = span>0.5 ? clamp((start - w)/(start - p.goalWeight), 0, 1) : 1;
    body = done*20;
    if(bf){
      // 体脂肪率：目標達成で満点、20%超で0点。顔の輪郭が出るのは概ね15%以下
      const bfScore = clamp((20 - bf)/(20 - p.goalBf), 0, 1)*10;
      body += bfScore;
      bodyNote = `体脂肪 ${r1(bf)}% / 目標 ${p.goalBf}%`;
    }else{
      body += 5; bodyNote = '体脂肪率も記録すると精度が上がります';
    }
    if(w) bodyNote = `${r1(w)}kg → 目標 ${p.goalWeight}kg` + (bf? ` ・ 体脂肪 ${r1(bf)}%`:'');
  }
  parts.push({k:'体組成', v: clamp(body,0,30), max:30, color:'var(--accent)', note: bodyNote});

  // ② トレーニング 25点
  // 暦の週ではなく直近14日で評価する（休みが不定期でも公平に測るため）
  const rv = E.rolling(date, 14);
  let volPts = 0;
  MUSCLES.forEach(m=>{
    const tg = E.volTarget14(m), s = rv.vol[m];
    volPts += clamp(s/tg.min,0,1) * (25/6) * (s > tg.max*1.3 ? 0.85 : 1);  // 明らかな過多は微減点
  });
  parts.push({k:'筋トレ', v: clamp(volPts,0,25), max:25, color:'var(--good)',
    note:`直近14日 ${rv.total}セット / ${rv.sessions}回` + (S.profile.mode==='maintain'?'（維持モード基準）':'')});

  // ③ 生活習慣 15点
  const sleepAvg = E.avg(date, 7, 'sleepH');
  const stepAvg  = E.avg(date, 7, 'steps');
  const waterAvg = E.avg(date, 7, 'water');
  const alcRate  = E.rate(date, 14, d=>(d.alcohol||0) > 0);
  let life = 0;
  life += sleepAvg ? clamp(sleepAvg/p.sleepTarget,0,1)*6 : 2;
  life += stepAvg  ? clamp(stepAvg/p.stepTarget,0,1)*3   : 1;
  life += waterAvg ? clamp(waterAvg/t.water,0,1)*3       : 1;
  life += alcRate  ? (1-clamp(alcRate.rate/0.5,0,1))*3   : 1.5;
  parts.push({k:'生活習慣', v: clamp(life,0,15), max:15, color:'var(--warn)',
    note: sleepAvg ? `睡眠 ${r1(sleepAvg)}h ・ ${stepAvg?Math.round(stepAvg).toLocaleString()+'歩':'歩数なし'}` : '記録なし'});

  // 肌・身だしなみは別アプリで管理するため外した。残り3項目（30/25/15点）の比率を保ったまま100点に換算する
  const MAX_NEW = {'体組成':43, '筋トレ':36, '生活習慣':21};
  parts.forEach(x=>{ const m = MAX_NEW[x.k]; if(m){ x.v = x.v*m/x.max; x.max = m; } });
  const total = parts.reduce((a,b)=>a+b.v, 0);
  return {total: Math.round(total), parts};
};

E.rank = (s)=>{
  if(s>=85) return {t:'S', c:'var(--warn)', m:'仕上がっています。この状態を維持するフェーズ'};
  if(s>=70) return {t:'A', c:'var(--good)', m:'かなり良い軌道。弱い項目を1つ潰せばSが見えます'};
  if(s>=55) return {t:'B', c:'var(--accent)', m:'土台はできています。継続が最大の武器'};
  if(s>=40) return {t:'C', c:'var(--accent2)', m:'伸びしろが大きい局面。まず記録を毎日続けること'};
  return {t:'D', c:'var(--dim)', m:'まずは1週間、記録を埋めるところから'};
};

/* ---------------------------------------------------------------
   5. アドバイス・ルールエンジン
       level: bad(要対処) / warn(注意) / info(提案) / good(称賛)
       pri  : 小さいほど上に出る
   --------------------------------------------------------------- */
E.advice = (date)=>{
  const A = [], p = S.profile, t = E.targets(date);
  const w = E.latestWeight(date);
  const d = day(date);
  const push = (o)=>A.push(o);

  /* --- 記録が乏しい場合の導入 --- */
  const logged = sortedDays().length;
  if(logged < 3){
    push({pri:0, level:'info', ico:'🧭', src:'ONBOARDING',
      title:'まずは3日ぶん記録を埋めてください',
      body:'体重・食事・睡眠が3日たまると、体重トレンドと実測ベースの消費カロリー推定が動き始めます。それまでのアドバイスは一般論ベースです。',
      act:'「記録」タブ → 今日の分を入力'});
  }

  /* --- 体重トレンド --- */
  const tr = E.weightTrend(date);
  if(tr && w){
    const perWeek = tr.perWeek;
    const pct = (perWeek / w) * 100;
    if(p.goalType==='cut'){
      if(perWeek > -0.05 && perWeek < 0.15){
        push({pri:1, level:'warn', ico:'⚖️', src:'ENERGY BALANCE',
          title:`体重が${Math.round(tr.span/7)}週間ほぼ横ばい（停滞）`,
          body:`${E.maLabel()}の傾きは週 ${r1(perWeek)}kg。減量が止まるのは代謝適応か、記録外の摂取（休みの外食・間食・飲み物）が原因の大半です。`,
          act:`摂取を ${t.kcal-180}kcal に下げるか、歩数を +2,000歩/日 のどちらか片方だけ変える`});
      }else if(pct < -1.0){
        push({pri:1, level:'bad', ico:'🚨', src:'MUSCLE RETENTION',
          title:'減量ペースが速すぎます（週 '+r1(pct)+'%）',
          body:'体重の1%/週を超える減少では筋肉と髪・肌のコンディションを削ります。顔がやつれて老けて見える典型パターンです。',
          act:`摂取を ${t.kcal+200}kcal 前後に戻し、タンパク質 ${t.protein}g は死守`});
      }else if(perWeek < 0){
        push({pri:6, level:'good', ico:'📉', src:'ENERGY BALANCE',
          title:`減量が理想ペースで進行中（週 ${r1(perWeek)}kg）`,
          body:'筋肉を保ちながら脂肪だけ落ちる範囲です。今の食事量とトレーニングを変えないでください。',
          act: E.isWeekly() ? `現状維持。次の測定日（${jpDate(E.nextWeighDay(date))}）も同じ条件で測る` : '現状維持。体重は毎朝トイレ後・裸で計測して条件を揃える'});
      }
    }else if(p.goalType==='bulk' && perWeek <= 0.05){
      push({pri:1, level:'warn', ico:'📈', src:'ENERGY BALANCE',
        title:'増量なのに体重が増えていません',
        body:'増量期は週 +0.2〜0.35%（体重の）が脂肪をつけすぎない上限です。',
        act:`摂取を ${t.kcal+250}kcal へ。固形で無理なら液体（牛乳・オイル）で足す`});
    }
    // 目標日から逆算
    if(p.goalDate && p.goalDate > date && p.goalWeight && w){
      const need = (w - p.goalWeight), weeks = Math.max(1, diffDays(date, p.goalDate)/7);
      const req = need/weeks;
      if(need > 0.5){
        const feasible = Math.abs(req) <= w*0.01;
        push({pri: feasible?7:3, level: feasible?'info':'warn', ico:'🎯', src:'GOAL PACE',
          title:`目標まで ${r1(need)}kg / 残り ${Math.round(weeks)}週`,
          body:`必要ペースは週 ${r1(req)}kg。` + (feasible
            ? '無理のない範囲です。現在のトレンドが続けば間に合います。'
            : '体重の1%/週を超える設定です。筋量を削らずに達成するのは困難なので、目標日を後ろへずらすのが現実的です。'),
          act: feasible ? '今のペースを維持' : '設定タブで目標日を延長するか、目標体重を見直す'});
      }
    }
  }

  /* --- 適応TDEE --- */
  const ad = E.tdeeAdaptive(date);
  if(ad){
    const diff = ad.value - E.tdeeStatic(w);
    if(Math.abs(diff) >= 180){
      push({pri:5, level:'info', ico:'🔬', src:'ADAPTIVE TDEE',
        title:`実測の消費カロリーは ${ad.value}kcal（計算式より ${diff>0?'+':''}${diff}）`,
        body:`直近${ad.days}日の平均摂取 ${ad.avgKcal}kcal と体重変化から逆算した値です。一般式より実測を信じてください。`,
        act:`目標摂取は ${t.kcal}kcal に自動更新済み`});
    }
  }

  /* --- タンパク質 --- */
  const pAvg = E.avg(date, 7, 'protein');
  if(pAvg && w){
    const perKg = pAvg / w;
    if(perKg < 1.6){
      push({pri:2, level:'bad', ico:'🍗', src:'NUTRITION',
        title:`タンパク質が不足（7日平均 ${Math.round(pAvg)}g = 体重×${r1(perKg)}g）`,
        body:'減量中に筋肉を守れる下限が体重×1.6g、理想は×2.0gです。ここが欠けると体重だけ落ちて「痩せたのに貧相」になります。',
        act:`あと ${Math.round(t.protein-pAvg)}g。鶏むね100g=23g / 卵1個=6g / プロテイン1杯=20g / ギリシャヨーグルト=10g`});
    }else if(perKg >= 1.9){
      push({pri:8, level:'good', ico:'💪', src:'NUTRITION',
        title:`タンパク質は十分（体重×${r1(perKg)}g）`,
        body:'筋合成の材料は足りています。この水準を保つ限り、減量しても除脂肪量は守られます。',
        act:'維持。1食あたり30〜40gに分散するとさらに効率的'});
    }
  }
  const fAvg = E.avg(date, 7, 'fat');
  if(fAvg && w && (fAvg/w) < 0.6){
    push({pri:4, level:'warn', ico:'🥑', src:'HORMONE / SKIN',
      title:'脂質が少なすぎます',
      body:`7日平均 ${Math.round(fAvg)}g（体重×${r1(fAvg/w)}g）。脂質が体重×0.6gを下回るとテストステロン低下と肌の乾燥・バリア低下を招きます。肌質は脂質不足が直撃します。`,
      act:'卵・青魚・オリーブオイル・ナッツで +20〜30g'});
  }

  /* --- 水分 --- */
  const wAvg = E.avg(date, 7, 'water');
  if(wAvg && wAvg < t.water*0.75){
    push({pri:5, level:'warn', ico:'💧', src:'SKIN / PERFORMANCE',
      title:`水分不足（7日平均 ${Math.round(wAvg)}ml / 目標 ${t.water}ml）`,
      body:'慢性的な水分不足は肌の張りを落とし、トレーニング中の筋力も数%下げます。効果が出るのが早い割に軽視されがちな項目です。',
      act:'起床直後・トレ前後・入浴後に各500mlを固定化する'});
  }

  /* --- 睡眠 --- */
  const sl3 = E.avg(date, 3, 'sleepH'), sl7 = E.avg(date, 7, 'sleepH');
  if(sl3 && sl3 < 6){
    push({pri:1, level:'bad', ico:'😴', src:'RECOVERY',
      title:`睡眠が3日平均 ${r1(sl3)}時間`,
      body:'5.5時間睡眠での減量は、8時間睡眠と比べて落ちた重量のうち筋肉の割合が大きく増えることが知られています。テストステロン低下・肌のターンオーバー遅延・目の下のクマも同時に来ます。見た目の投資対効果では睡眠が最強です。',
      act:'今日は高重量を避けRPE7止まりに。就寝90分前に入浴、寝る1時間前は画面を落とす'});
  }else if(sl7 && sl7 >= p.sleepTarget){
    push({pri:9, level:'good', ico:'🌙', src:'RECOVERY',
      title:`睡眠が週平均 ${r1(sl7)}時間で確保できています`,
      body:'回復・ホルモン・肌のすべてに効いています。トレーニングの伸びも出やすい状態です。',
      act:'維持。起床時刻を固定するとさらに安定します'});
  }

  /* --- アルコール --- */
  const alc = E.rate(date, 14, x=>(x.alcohol||0)>0);
  if(alc && alc.rate > 0.4){
    push({pri:4, level:'warn', ico:'🍺', src:'RECOVERY / SKIN',
      title:`飲酒が14日中 ${alc.ok}日`,
      body:'飲酒は筋タンパク合成を一時的に大きく落とし、深い睡眠を削り、翌日のむくみ（顔）と肌の乾燥を招きます。カロリーそのものより回復への影響が問題です。',
      act:'週2日以内に。飲む日はトレーニングの翌日ではなくオフ日の前夜へ寄せる'});
  }

  /* --- シフト前提のコンディション --- */
  const rec = E.recovery(date);
  const plan = E.dayPlan(date);
  const trainedToday = S.workouts.some(x=>x.date===date);
  const offName = ['日','月','火','水','木','金','土'];
  const offLabel = (p.offDays||[]).map(i=>offName[i]).join('・');

  if(rec.level!=='ok' && !trainedToday){
    push({pri:1, level: rec.level==='bad'?'bad':'warn', ico:'🔋', src:'AUTOREGULATION',
      title:`今日は強度を落とす日です（${rec.reasons.join(' / ')}）`,
      body:'不規則勤務で削れているときに予定どおりの重量を狙うと、伸びないどころか関節と自律神経を痛めます。強度を落として「回数だけこなす」ほうが、翌週の伸びは大きくなります。',
      act:`セット数を25〜50%減らし、RPE${rec.level==='bad'?7:8}まで。潰れるまで追い込まない`});
  }
  const weddingDays = daysUpTo(date, 7).filter(x=>x.shift==='wedding').length;
  const nightDays   = daysUpTo(date, 14).filter(x=>x.shift==='allnight').length;
  if(nightDays >= 1){
    push({pri:2, level:'warn', ico:'🌙', src:'SHIFT',
      title:`直近2週間で徹夜が${nightDays}日`,
      body:'徹夜は1回で数日ぶんの回復を奪います。ホルモンも食欲の調節も乱れるので、翌日以降は「取り返そう」とせず、寝ることと食べることを優先してください。',
      act:`次の休み（${offLabel}）は睡眠を最優先。トレーニングは軽い全身か、なしでも構いません`});
  }
  if(weddingDays >= 4){
    push({pri:3, level:'warn', ico:'💒', src:'SHIFT',
      title:`直近7日で挙式対応が${weddingDays}日`,
      body:'立ち仕事と搬入搬出が続く週は、それ自体が相当な運動量です。ここに通常どおりのトレーニングを重ねると、回復が追いつかず食欲だけが増えます。',
      act:'今週は増やすより減らさないことを優先。20分の補填だけに切り替える'});
  }
  if(E.isOffDay(date) && !trainedToday){
    push({pri:2, level:'info', ico:'🎯', src:'SHIFT',
      title:`今日は定休日 — ${plan.label}の日`,
      body:'不規則勤務では、休みの日にメインを置けるかどうかで2週間のボリュームがほぼ決まります。逆に、ここさえ守れば平日が潰れても帳尻は合います。',
      act:`ホームの「今日のメニュー」から ${plan.minutes}分 を選んで実行する`});
  }
  const lateNights = daysUpTo(date, 7).filter(x=>{
    const et = E.endTime(x);
    if(!et) return false;
    const hh = parseInt(et.split(':')[0],10);
    return hh >= (p.lateHour||23) || hh < 5;
  }).length;
  if(lateNights >= 3){
    push({pri:4, level:'warn', ico:'🌃', src:'SHIFT',
      title:`直近7日で退勤が遅い日が${lateNights}日`,
      body:'退勤が遅い日にトレーニングを詰め込むと、就寝が後ろにずれて睡眠が削れ、翌日の回復と肌にそのまま跳ね返ります。遅い日はトレーニングを捨てて寝るほうが、2週間の合計では明らかに得です。',
      act:'遅い日はストレッチと保湿だけ。その分を休みの日のメインに回す'});
  }
  if(p.mode==='build' && (nightDays>=1 || weddingDays>=4) && lateNights>=3){
    push({pri:3, level:'info', ico:'🛟', src:'MODE',
      title:'繁忙期なら「維持モード」への切り替えを検討してください',
      body:'維持に必要な量は、伸ばすのに必要な量の半分以下です。忙しい時期に目標を下げておけば、達成できない記録が積み上がってやめてしまう事態を防げます。筋量は週1回・各部位2〜3セットでも維持できます。',
      act:'設定タブ → モードを「維持」に。落ち着いたら「伸ばす」に戻す'});
  }

  /* --- トレーニング・ボリューム（直近14日のローリング） --- */
  const rv = E.rolling(date, 14);
  const debt = E.debt(date);
  debt.forEach(dd=>{
    const m = dd.m, tg = E.volTarget14(m);
    if(dd.ratio < 0.6){
      const sug = E.pool().filter(e=>e.m===m).sort((a,b)=>b.c-a.c).slice(0,2).map(e=>e.n).join(' / ');
      push({pri: (m==='肩'||m==='背中') ? 3 : 5, level:'warn', ico:'🏋️', src:'VOLUME (14日)',
        title:`${m}が不足（直近14日 ${dd.sets} / 目標 ${tg.min}セット）`,
        body: m==='肩' ? '肩幅は見た目の投資対効果が最も高い部位です。三角筋中部が育つと、相対的に顔が小さく、ウエストが細く見えます。'
            : m==='背中' ? '背中は正面から見えませんが、広背筋の広がりがV字シルエットと姿勢をつくります。'
            : `${m}が2週間の目標セット数に届いていません。`,
        act:`次のセッションで ${sug} を3セット`});
    }else if(dd.sets > tg.max*1.4){
      push({pri:6, level:'warn', ico:'⚠️', src:'VOLUME (14日)',
        title:`${m}のボリュームが過多（直近14日 ${dd.sets}セット）`,
        body:'上限を大きく超えると回復が追いつかず、伸びが止まるか関節を痛めます。量より1セットの質です。',
        act:`${tg.max}セット以内に抑え、その分1セットを限界近くまで`});
    }
  });
  if(rv.sessions === 0){
    push({pri:2, level:'warn', ico:'🕳️', src:'VOLUME (14日)',
      title:'2週間トレーニングの記録がありません',
      body:'筋量が目に見えて落ち始めるのは概ね3週間からです。今ならまだ完全に取り戻せます。',
      act:'次の休みに20分だけでいいので再開する'});
  }

  // push/pull バランス（巻き肩・姿勢）
  const m4 = E.countSets(E.workoutsIn(addDays(date,-27), date));
  if(m4.push + m4.pull >= 30 && m4.push > m4.pull*1.4){
    push({pri:3, level:'warn', ico:'🧍', src:'POSTURE',
      title:`押す種目に偏っています（直近4週 押 ${m4.push} : 引 ${m4.pull}）`,
      body:'プレス系に偏ると肩が前に入り、巻き肩・猫背になります。姿勢が崩れると、体を鍛えていても服の上からは冴えて見えません。姿勢は見た目への影響が体脂肪率の次に大きい要素です。',
      act:'引く種目を押す種目と同数以上に。フェイスプル・リアレイズを毎回2セット足すのが手っ取り早い'});
  }
  if(rv.vol['脚'] === 0 && rv.sessions >= 3){
    push({pri:5, level:'info', ico:'🦵', src:'PROGRAMMING',
      title:'2週間、脚を踏んでいません',
      body:'脚は全身のホルモン応答と基礎代謝への寄与が大きく、上半身の伸びにも効きます。加えて、脚が細いとスーツもデニムも似合いません。',
      act:'スクワットかレッグプレスを3セットだけでも入れる'});
  }

  /* --- PR・停滞 --- */
  const prs = E.prsIn(addDays(date,-7), date);
  if(prs.length){
    const top = prs[prs.length-1];
    push({pri:7, level:'good', ico:'🏆', src:'PROGRESSION',
      title:`今週 ${prs.length}種目で自己ベスト更新`,
      body:`直近は ${top.name} ${top.w}kg × ${top.reps}回（推定1RM ${r1(top.e1rm)}kg）。漸進性過負荷が効いている証拠です。`,
      act:'次回も同じ流れで。フォームが崩れた時点で重量アップは止める'});
  }
  const st = E.stalled(date, 3);
  if(st.length){
    push({pri:4, level:'info', ico:'🔁', src:'PROGRESSION',
      title:`${st[0].name} が3週間ベスト更新なし`,
      body:'停滞の原因はほぼ「回復不足」か「刺激の慣れ」です。重量を追うより一度戻して積み直すほうが早く伸びます。',
      act:'1週デロード（重量−10%・セット数半分）→ 翌週にベスト重量へ復帰。または種目を近い動作に入れ替える'});
  }

  /* --- 体脂肪率と顔まわり --- */
  const bf = E.latestBf(date);
  if(bf){
    if(bf > 18){
      push({pri:2, level:'info', ico:'🫥', src:'AESTHETICS',
        title:'まずは体脂肪を落とすフェーズです',
        body:`現在 ${r1(bf)}%。顎のラインと頬骨が出てくるのは概ね15%以下、はっきり変わるのは12%前後です。同じ顔でも体脂肪率で印象は大きく変わるため、増量より先に絞るほうが見た目への即効性があります。`,
        act:'減量を継続しつつ、筋トレは重量維持で筋量をキープ'});
    }else if(bf <= p.goalBf + 1){
      push({pri:7, level:'good', ico:'✨', src:'AESTHETICS',
        title:`体脂肪 ${r1(bf)}% — 目標ゾーンに到達`,
        body:'輪郭・腹筋が出る水準です。ここから先は絞るより「乗せる」ほうがリターンが大きくなります。',
        act:'設定の目標タイプを「リコンプ」か「増量」に切り替えて、肩と背中を厚くする局面へ'});
    }
  }

  /* --- 記録の抜け --- */
  if(logged >= 3){
    if(E.isWeekly()){
      const todayIsWeigh = E.isWeighDay(date);
      if(todayIsWeigh && !d.weight){
        push({pri:2, level:'info', ico:'⚖️', src:'TRACKING',
          title:'今日は体重の測定日です',
          body:'週1回なので、この1回を落とすと2週間ぶんの判断材料がなくなります。起床直後・トイレ後・裸で、毎回同じ条件で測ってください。',
          act:'ホームの入力欄に体重（できれば体脂肪率とウエストも）を入れる'});
      }
      const last4 = E.weightSeries().slice(-4);
      const gap = last4.length ? diffDays(last4[last4.length-1].date, date) : 999;
      if(gap > 16 && logged >= 14){
        push({pri:3, level:'warn', ico:'📋', src:'TRACKING',
          title:`体重を${gap}日測っていません`,
          body:'週1回の測定でも、2回以上飛ぶと傾きが計算できなくなり、停滞なのか順調なのか判断できなくなります。',
          act:`次の${jpDate(E.nextWeighDay(date))}に必ず測る`});
      }
    }else{
      const rec = E.rate(date, 7, x=>x.weight);
      if(rec && rec.rate < 0.5){
        push({pri:3, level:'warn', ico:'📋', src:'TRACKING',
          title:'体重の記録が飛んでいます',
          body:`直近7日で ${rec.ok}日のみ。毎日測らないと移動平均が使えず、停滞の判定も消費カロリーの逆算もできません。1日の増減に意味はなく、7日平均にしか意味がありません。`,
          act:'毎朝つらければ、設定で「週1回（火曜）」に切り替えることもできます'});
      }
    }
  }
  if(logged >= 14){
    const lb = S.meta.lastBackup;
    if(!lb || diffDays(lb, date) > 30){
      push({pri:7, level:'info', ico:'💾', src:'DATA',
        title: lb ? `バックアップが${diffDays(lb,date)}日前のままです` : 'まだバックアップを取っていません',
        body:`${logged}日分の記録が、この端末のブラウザ内にだけ保存されています。履歴の削除・機種変更・ブラウザの不調で消えると復旧できません。`,
        act:'設定タブ →「バックアップを書き出す」でJSONを保存（月1回で十分です）'});
    }
  }

  const streak = E.streak(date);
  if(streak >= 7){
    push({pri:8, level:'good', ico:'🔥', src:'HABIT',
      title:`${streak}日連続で記録できています`,
      body:'記録の継続そのものが結果に最も強く相関します。可視化されている限り、判断は必ず改善していきます。',
      act:'この連続記録を切らさないこと'});
  }

  /* --- 栄養素の7日傾向（朝昼夕がそろった日だけで判定） --- */
  const nw = E.nWeek(date);
  if(nw){
    const T = nw.T, av = nw.avg;
    if(av.s!=null && av.s > T.s*1.1){
      push({pri:3, level:'warn', ico:'🧂', src:'NUTRITION',
        title:`塩分が多い日が続いています（${nw.days}日平均 ${r1(av.s)}g / 目標 ${T.s}g未満）`,
        body:'塩分が多いと水分をため込み、顔のむくみと体重の上振れにつながります。体重が減らない原因が脂肪ではなく水分のこともあります。',
        act:'麺・汁物の汁を残す／外食・弁当の日は他の食事を薄味に'});
    }
    const lows = NUT_NEED.filter(k=>av[k]!=null).map(k=>[k, av[k]/T[k]]).filter(x=>x[1]<0.6).sort((a,b)=>a[1]-b[1]).slice(0,2);
    if(lows.length){
      const N = {tot:av, unk:{}}; NUT_K.forEach(k=>{ N.unk[k] = av[k]==null?1:0; });
      const sg = E.nSuggest(N, Object.assign({}, T, {k: av.k + 300})).slice(0,3).map(x=>x.f.n);
      push({pri:4, level:'warn', ico:'🥦', src:'NUTRITION',
        title:`${lows.map(x=>NUT_L[x[0]]).join('・')}が慢性的に不足（${nw.days}日平均で目標の${lows.map(x=>Math.round(x[1]*100)+'%').join('・')}）`,
        body:'ビタミン・ミネラルの不足は肌荒れ・疲れやすさ・筋肉の回復の遅れとして出ます。サプリより先に、いつもの食事に1品足すほうが続きます。',
        act: sg.length ? `足しやすい1品：${sg.join(' ／ ')}` : '野菜・乳製品・大豆製品を1日1品ずつ'});
    }
  }

  A.sort((a,b)=> a.pri - b.pri);
  return A;
};

/* ---------------------------------------------------------------
   6. チャート（依存ライブラリなし・インラインSVG）
   --------------------------------------------------------------- */
const C = {};

C.line = (series, opt)=>{
  opt = opt||{};
  const W=680, H=opt.h||210, pl=42, pr=12, pt=12, pb=24;
  const all = series.flatMap(s=>s.points);
  if(all.length < 2) return `<div class="empty">データが2件以上たまるとグラフが表示されます</div>`;
  const xs = all.map(p=>parseYmd(p.x).getTime());
  let minY = Math.min(...all.map(p=>p.y)), maxY = Math.max(...all.map(p=>p.y));
  if(opt.refs) opt.refs.forEach(r=>{ minY=Math.min(minY,r.y); maxY=Math.max(maxY,r.y); });
  const pad = (maxY-minY)*0.15 || 1; minY-=pad; maxY+=pad;
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const X = t => pl + (maxX===minX?0.5:((t-minX)/(maxX-minX))) * (W-pl-pr);
  const Y = v => pt + (1-(v-minY)/(maxY-minY)) * (H-pt-pb);

  let g = '';
  // 横グリッド
  for(let i=0;i<=3;i++){
    const v = minY + (maxY-minY)*i/3, y = Y(v);
    g += `<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${pl-7}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--dim)">${r1(v)}</text>`;
  }
  // 参照線
  (opt.refs||[]).forEach(r=>{
    g += `<line x1="${pl}" y1="${Y(r.y)}" x2="${W-pr}" y2="${Y(r.y)}" stroke="${r.color||'var(--warn)'}" stroke-width="1" stroke-dasharray="4 4" opacity=".8"/>`;
    g += `<text x="${W-pr}" y="${Y(r.y)-5}" text-anchor="end" font-size="9.5" fill="${r.color||'var(--warn)'}">${esc(r.label||'')}</text>`;
  });
  // 系列
  series.forEach(s=>{
    const pts = s.points.map(p=>[X(parseYmd(p.x).getTime()), Y(p.y)]);
    const dAttr = pts.map((q,i)=>(i?'L':'M')+r1(q[0])+' '+r1(q[1])).join(' ');
    if(s.area){
      g += `<path d="${dAttr} L ${r1(pts[pts.length-1][0])} ${H-pb} L ${r1(pts[0][0])} ${H-pb} Z" fill="${s.color}" opacity=".08"/>`;
    }
    g += `<path d="${dAttr}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="4 4"':''} opacity="${s.opacity||1}"/>`;
    if(s.dots) pts.forEach(q=> g += `<circle cx="${r1(q[0])}" cy="${r1(q[1])}" r="${s.dotR||2.4}" fill="${s.color}" opacity=".9"/>`);
  });
  // X軸ラベル
  const first = all[0].x, last = all[all.length-1].x;
  g += `<text x="${pl}" y="${H-6}" font-size="10" fill="var(--dim)">${jpDate(first)}</text>`;
  g += `<text x="${W-pr}" y="${H-6}" text-anchor="end" font-size="10" fill="var(--dim)">${jpDate(last)}</text>`;

  const leg = series.filter(s=>s.name).map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`
       + (leg?`<div class="legend">${leg}</div>`:'');
};

C.volBars = (vol)=>{
  return MUSCLES.map(m=>{
    const tg = E.volTarget14(m), v = vol[m]||0;
    const pct = clamp(v/tg.max, 0, 1)*100;
    const minPct = (tg.min/tg.max)*100;
    const col = v < tg.min ? 'var(--dim)' : (v > tg.max*1.3 ? 'var(--bad)' : MUSCLE_COLOR[m]);
    return `<div class="bd-row">
      <span class="lbl">${m}</span>
      <span class="bar" style="position:relative">
        <i style="width:${pct}%;background:${col}"></i>
        <i style="position:absolute;left:${minPct}%;top:0;width:2px;height:100%;background:var(--txt);opacity:.45;border-radius:0"></i>
      </span>
      <span class="num">${v}/${tg.min}</span>
    </div>`;
  }).join('');
};

C.ring = (score, color)=>{
  const R=58, c=2*Math.PI*R, off = c*(1-clamp(score/100,0,1));
  return `<div class="ring">
    <svg viewBox="0 0 132 132" width="132" height="132">
      <circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--card2)" stroke-width="10"/>
      <circle cx="66" cy="66" r="${R}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${r1(c)}" stroke-dashoffset="${r1(off)}" style="transition:stroke-dashoffset .8s ease"/>
    </svg>
    <div class="val"><b>${score}</b><span>IKEMEN SCORE</span></div>
  </div>`;
};

const CAT_ICON  = {'食事・体重':'🍽','トレーニング':'🏋️','休養・生活':'😴','見た目':'✨','記録の習慣':'📋'};

function advCard(a){
  return `<div class="adv ${a.level}">
    <div class="ico">${a.ico}</div>
    <div class="bd">
      <b>${esc(a.title)}</b>
      <p>${esc(a.body)}</p>
      ${a.act?`<div class="do">▶ ${esc(a.act)}</div>`:''}
      <div class="src">${esc(a.src)}</div>
    </div>
  </div>`;
}

function renderAdviceGroups(adv, limit){
  if(!adv.length) return `<div class="card"><h3>今日のコーチング</h3><div class="empty">記録が増えるとここにアドバイスが出ます</div></div>`;
  const groups = {};
  adv.forEach(a=>{ const c = ADV_CAT[a.src] || 'その他'; (groups[c] = groups[c]||[]).push(a); });
  const order = CAT_ORDER.concat(['その他']).filter(c=>groups[c]);
  return order.map(c=>{
    const list = groups[c];
    const shown = limit ? list.slice(0, limit) : list;
    const worst = list.some(x=>x.level==='bad') ? 'bad' : list.some(x=>x.level==='warn') ? 'warn' : 'good';
    const dot = worst==='bad' ? 'var(--bad)' : worst==='warn' ? 'var(--warn)' : 'var(--good)';
    const body = shown.map(advCard).join('') +
      (limit && list.length>limit ? `<div class="hint">ほか ${list.length-limit} 件（「分析」タブで全部見られます）</div>` : '');
    return sect('adv-'+c, `${CAT_ICON[c]||'•'} ${c}`,
      `<span style="color:${dot}">●</span> ${list.length}件`, body, true);
  }).join('');
}

  h += `<div class="grid g4">
    ${statCard(`体重（${E.maLabel()}）`, w? r1(avgOrRaw(date)) : '—', w?'kg':'', trTxt, trCls)}

    ${statCard('今日の摂取', d.kcal? d.kcal.toLocaleString() : '—', d.kcal?'kcal':'', `目標 ${t.kcal.toLocaleString()}${kcalPct?` (${kcalPct}%)`:''}`, kcalPct&&kcalPct>110?'up':'flat')}
    ${statCard('直近14日のセット数', rv.total, 'set', `${rv.sessions}回 / ${(rv.tonnage/1000).toFixed(1)}t`)}
  </div>`;

  // 測定日の案内（入力は「からだ」タブに集約）
  if(E.isWeekly() && E.isWeighDay(date) && d.weight==null){
    h += `<div class="card tight"><div class="row" style="justify-content:space-between">
      <div><b style="font-size:14px;color:var(--accent)">今日は体重の測定日です</b>
