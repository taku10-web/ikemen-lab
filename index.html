    </div></div>`;
  }

  // 直近7日のカロリー収支
  const bal = E.calBalance7(date);
  if(bal){
    const over = bal.diff > 0;
    h += `<div class="card tight"><div class="row" style="justify-content:space-between">
      <div>
        <div style="font-size:11px;color:var(--dim);letter-spacing:.1em">直近${bal.days}日のカロリー収支</div>
        <div style="font-size:15px;margin-top:2px">
          <b style="color:${Math.abs(bal.diff)<400?'var(--good)':over?'var(--bad)':'var(--warn)'}">${over?'+':''}${bal.diff.toLocaleString()}kcal</b>
          <span style="font-size:12px;color:var(--sub)">（摂取 ${bal.intake.toLocaleString()} / 目標 ${bal.target.toLocaleString()}）</span>
        </div>
      </div>
      <div style="font-size:11.5px;color:var(--sub);text-align:right;max-width:52%">
        ${Math.abs(bal.diff)<400 ? '目標どおりに進んでいます'
          : over ? `1日あたり ${Math.round(bal.diff/bal.days)}kcal 超過。飲み会の前後で調整すれば取り返せます`
                 : `1日あたり ${Math.abs(Math.round(bal.diff/bal.days))}kcal 不足。減らしすぎは筋量を削ります`}
      </div>
    </div></div>`;
  }

  // コーチング（項目別・折りたたみ）
  h += renderAdviceGroups(adv, 2);

  // 部位別ボリューム（ローリング14日）
  h += `<div class="card">
    <h3>部位別ボリューム<span class="tag">直近14日（${jpDate(rv.from)} 〜 ${jpDate(rv.to)}）</span></h3>
    ${C.volBars(rv.vol)}
    <div class="hint">休みが不定期なので、暦の週ではなく<b>直近14日</b>で集計しています。白い縦線＝2週間の最低ライン。
    押す:引く = ${rv.push}:${rv.pull}（引く側が同数以上だと姿勢が保たれます）${S.profile.mode==='maintain'?' ／ 維持モードのため目標を下げています':''}</div>
  </div>`;

  // 体重グラフ
  const ws = E.weightSeries().slice(-90);
  h += `<div class="card">
    <h3>体重の推移<span class="tag">直近90日</span></h3>
    ${C.line([
      {name:'実測', color:'var(--dim)', points: ws.map(p=>({x:p.date,y:p.raw})), w:1.2, opacity:.7, dots:true, dotR:2.4},
      {name:E.maLabel(), color:'var(--accent)', points: ws.map(p=>({x:p.date,y:p.ma})), w:2.6, area:true}
    ], {refs: S.profile.goalWeight?[{y:S.profile.goalWeight, label:'目標 '+S.profile.goalWeight+'kg', color:'var(--warn)'}]:[]})}
    <div class="hint">${E.isWeekly()
      ? '体重は水分と便で±1kg動きます。週1測定では1回の値に意味はないので、判断は必ず青線（直近4回の平均）で行ってください。前日に外食や飲酒があった週は高く出ます。'
      : '日々の増減は水分と便で±1kg動きます。判断は必ず7日移動平均（青線）で行ってください。'}</div>
  </div>`;

  // 今日の記録状況
  const filled = [];
  if(d.weight) filled.push('体重'); if(d.kcal||d.protein) filled.push('食事');
  if(d.sleepH) filled.push('睡眠');
  if(S.workouts.some(x=>x.date===date)) filled.push('トレーニング');
  h += `<div class="card tight">
    <div class="row" style="justify-content:space-between">
      <div>
        <div style="font-size:12px;color:var(--sub)">${jpDate(date)} の記録</div>
        <div style="font-size:13px;margin-top:3px">${filled.length? filled.join(' / ') : '<span style="color:var(--dim)">まだ記録がありません</span>'}
          ${E.streak(date)>=3?`<span class="streak"> 🔥${E.streak(date)}日連続</span>`:''}</div>
      </div>
      <div class="row" style="flex-wrap:nowrap">
        <button class="btn ghost sm" onclick="go('food')">食事</button>
        <button class="btn sm" onclick="go('log')">からだ</button>
      </div>
    </div>
  </div>`;

  $('#v-home').innerHTML = h;
}

function avgOrRaw(date){
  const ws = E.weightSeries().filter(p=>p.date<=date);
  return ws.length ? ws[ws.length-1].ma : (E.latestWeight(date)||0);

// 就寝〜起床の時刻から睡眠時間を出す（日付をまたぐ場合は24時間足す）
function sleepHours(st, en){
  if(!st || !en) return null;
  let m = toMin(en) - toMin(st); if(m <= 0) m += 1440;
  return Math.round(m/60*100)/100;
}
function sleepCalcText(d, t){
  if(d.sleepStart && d.sleepEnd) return `睡眠 <b>${r1(d.sleepH)}時間</b>（目標 ${t.sleep}時間）`;
  if(d.sleepH && !d.sleepStart && !d.sleepEnd) return `この日は時刻なしで ${r1(d.sleepH)}時間 と記録されています。`;
  return '寝た時刻と起きた時刻を入れると、睡眠時間を自動で計算します（今朝起きた分をこの日の睡眠として記録）。';
}

}

/* -------- 写真（定点撮影）--------
   画像は本体データとは別のキーに保存する（本体の保存を軽く保つため）。
   保存時に長辺640pxへ縮小してJPEGに変換するので、1枚あたり数十KBに収まる。 */
const PHOTO_KEY = 'ikemenlab_photos_v1';
let PHOTOS = null;

function loadPhotos(){
  if(PHOTOS) return PHOTOS;
  try{ PHOTOS = JSON.parse(localStorage.getItem(PHOTO_KEY)) || []; }
  catch(e){ PHOTOS = []; }
  return PHOTOS;
}
function savePhotos(){
  try{ localStorage.setItem(PHOTO_KEY, JSON.stringify(PHOTOS)); return true; }
  catch(e){ toast('写真の保存に失敗しました（容量超過）。古い写真を削除してください'); return false; }
}
function addPhotoFile(file){
  const rd = new FileReader();
  rd.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const max = 640;
      const sc = Math.min(1, max/Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const data = cv.toDataURL('image/jpeg', 0.62);
      const d = day(VIEW_DATE);
      loadPhotos().push({
        id:'p'+Date.now(), date:VIEW_DATE, data,
        w: E.latestWeight(VIEW_DATE), bf: E.latestBf(VIEW_DATE),
        mr: E.latestOf(VIEW_DATE,'muscleRate')
      });
      PHOTOS.sort((a,b)=> a.date<b.date?-1:1);
      if(savePhotos()){ render(true); toast('写真を保存しました'); }
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

// 写真の比較コーチング（画像は解析できないので、撮影時点の数値の変化を添える）
function photoCoach(){
  const ps = loadPhotos();
  if(ps.length < 2) return null;
  const a = ps[0], b = ps[ps.length-1];
  const days = diffDays(a.date, b.date);
  if(days < 7) return null;
  const parts = [];
  if(a.w!=null && b.w!=null)   parts.push(`体重 ${r1(a.w)}→${r1(b.w)}kg（${b.w-a.w>0?'+':''}${r1(b.w-a.w)}）`);
  if(a.bf!=null && b.bf!=null) parts.push(`体脂肪 ${r1(a.bf)}→${r1(b.bf)}%（${b.bf-a.bf>0?'+':''}${r1(b.bf-a.bf)}）`);
  if(a.mr!=null && b.mr!=null) parts.push(`骨格筋率 ${r1(a.mr)}→${r1(b.mr)}%（${b.mr-a.mr>0?'+':''}${r1(b.mr-a.mr)}）`);
  let msg;
  if(a.bf!=null && b.bf!=null && b.bf < a.bf - 0.8){
    msg = '体脂肪が落ちているので、写真では輪郭と腹部に差が出ているはずです。鏡で毎日見ていると気づけない部分なので、2枚を並べて確認してください。';
  }else if(a.w!=null && b.w!=null && Math.abs(b.w-a.w) < 0.7){
    msg = '体重はほぼ動いていませんが、体組成が入れ替わっていれば見た目は変わります。数値ではなく写真で判断してください。';
  }else{
    msg = '同じ場所・同じ時間帯・同じ明るさで撮ると、比較の精度が上がります。';
  }
  return {days, parts, msg, a, b};
}

/* 栄養成分表示の貼り付けを読み取る
   1行ずつ見て、項目名と同じ行（なければ次の行）の数値を拾う。範囲や「未満」など迷う値は入れずに要確認として返す */
const LABEL_PAT = [
  ['mfK',   /熱量|エネルギー/],
  ['mfP',   /たんぱく質|タンパク質|蛋白質|たん白質/],
  ['mf_sf', /飽和脂肪酸/],
  ['mfF',   /脂質/],
  ['mfC',   /炭水化物/],
  ['mfSugar',/糖質/],
  ['mf_fb', /食物繊維/],
  ['mf_s',  /食塩相当量|食塩/],
  ['na',    /ナトリウム/],
  ['mf_ca', /カルシウム/],
  ['mf_fe', /鉄/],
  ['mf_a',  /ビタミンA/i],
  ['mf_e',  /ビタミンE/i],
  ['mf_b1', /ビタミンB\s*[1１₁](?![2２₂])/i],
  ['mf_b2', /ビタミンB\s*[2２₂]/i],
  ['mf_vc', /ビタミンC/i],
];
const LABEL_NAME = {mfK:'熱量',mfP:'たんぱく質',mfF:'脂質',mf_sf:'飽和脂肪酸',mfC:'炭水化物',mfSugar:'糖質',mf_fb:'食物繊維',mf_s:'食塩相当量',na:'ナトリウム',
  mf_ca:'カルシウム',mf_fe:'鉄',mf_a:'ビタミンA',mf_e:'ビタミンE',mf_b1:'ビタミンB1',mf_b2:'ビタミンB2',mf_vc:'ビタミンC'};
function parseLabel(text){
  const z2h = t => t.replace(/[０-９．，]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[ｇ]/g,'g').replace(/ｍｇ/g,'mg').replace(/ｋｃａｌ/gi,'kcal');
  const lines = z2h(String(text||'')).split(/\r?\n/).map(l=>l.replace(/^[\s*・\-•●◆■]+/,'').trim()).filter(Boolean);
  const labelOf = l => { for(const [id,re] of LABEL_PAT) if(re.test(l)) return id; return null; };
  const got = {}, unsure = [], empty = [];
  let per100 = false;
  lines.forEach((l,i)=>{
    if(/100\s*(g|ml)\s*(当た|あた)り/i.test(l)) per100 = true;
    const id = labelOf(l); if(!id || got[id]!=null) return;
    let rest = l.replace(LABEL_PAT.find(x=>x[0]===id)[1], '');
    if(!/\d/.test(rest) && lines[i+1] && !labelOf(lines[i+1])) rest = lines[i+1];
    if(/[〜~～]|未満|以下|以上|[<＜>＞]/.test(rest)){ unsure.push(`${LABEL_NAME[id]}「${rest.trim()}」`); return; }
    if(/^(\s|[:：])*(tr|微量)/i.test(rest)){ got[id] = 0; return; }
    const m = rest.replace(/,/g,'').match(/(\d+(?:\.\d+)?)\s*(kcal|mg|μg|µg|ug|g)?/i);
    if(!m){ empty.push(LABEL_NAME[id]); return; }
    let v = +m[1]; const u = (m[2]||'').toLowerCase();
    if(id==='na'){ got.na = u==='g' ? v*1000 : v; return; }                      // mg で持つ
    if(id==='mf_a' && u==='mg') v *= 1000;
    if(['mf_ca','mf_fe','mf_e','mf_b1','mf_b2','mf_vc'].includes(id) && u==='g') v *= 1000;
    if(['mf_ca','mf_fe','mf_e','mf_b1','mf_b2','mf_vc'].includes(id) && /μg|µg|ug/.test(u)) v /= 1000;
    if(['mfP','mfF','mf_sf','mfC','mfSugar','mf_fb','mf_s'].includes(id) && u==='mg') v /= 1000;
    got[id] = Math.round(v*1000)/1000;
  });
  // 食塩相当量が無くナトリウムだけある場合は換算（食塩相当量 g ＝ ナトリウム mg × 2.54 ÷ 1000）
  let naNote = '';
  if(got.mf_s==null && got.na!=null){ got.mf_s = Math.round(got.na*2.54/100)/10; naNote = `食塩相当量はナトリウム ${got.na}mg から換算しました（×2.54）。`; }
  delete got.na;
  return {got, unsure, empty, per100, naNote};
}

/* 栄養バランス（14項目）— 塩梅 ANBAI を統合 */
let NUT_SUGG = [];
function renderNutri(date){
  const N = E.nutri(date), T = E.nTargets(date);
  if(!N.n) return '';
  const sc = E.nScore(N, T), A = E.nAdvice(date, N, T);
  NUT_SUGG = E.nSuggest(N, T);
  const col = sc>=80?'var(--good)':sc>=60?'var(--warn)':'var(--bad)';
  const R = 38, C = 2*Math.PI*R;
  const tgtTxt = k => k==='p' ? `${T.p}以上` : (k==='f'||k==='c') ? `${Math.round(T[k]*0.8)}〜${Math.round(T[k]*1.2)}` :
    (k==='s'||k==='sf') ? `${nfmt(k,T[k])}未満` : nfmt(k,T[k]);
  const rows = NUT_K.map(k=>{
    const j = E.nJudge(k, N.tot[k], T, N.unk);
    const w = clamp(N.tot[k]/T[k]/1.5, 0, 1)*100;
    const c = {ok:'var(--good)', low:'var(--warn)', over:'var(--bad)', na:'var(--dim)'}[j.st];
    return `<div class="lbl">${NUT_L[k]}</div>
      <div class="nbar"><i style="width:${w}%;background:${c};${j.st==='na'?'opacity:.35':''}"></i><span class="tgt"></span></div>
      <div class="val">${j.lb?`<span style="color:var(--dim)">${j.st==='na'?'保留 ':''}${nfmt(k,N.tot[k])}+</span>`:nfmt(k,N.tot[k])}<span style="opacity:.65"> / ${tgtTxt(k)}${k==='k'?'':NUT_U[k]}</span></div>`;
  }).join('');
  const TAG = {good:['良好','var(--good)'], warn:['注意','var(--warn)'], bad:['改善','var(--bad)']};
  const body = `<div class="nhero">
      <div class="nring"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="${R}" fill="none" stroke="var(--card2)" stroke-width="9"/>
        <circle cx="46" cy="46" r="${R}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*sc/100} ${C}"/></svg>
        <div class="v"><b>${sc}</b><span>${N.partial?'途中経過':'点'}</span></div></div>
      <div style="flex:1;min-width:0;font-size:12.5px;color:var(--sub)">
        14項目それぞれの達成度を100点満点に換算した、その日の食事の点数です。${N.partial?'朝昼夕がそろうまでは途中経過です。':''}
      </div>
    </div>
    ${A.map(a=>`<p class="nmsg"><span class="tg" style="background:${TAG[a.t][1]}">${TAG[a.t][0]}</span><b>${esc(a.h)}</b><br><span style="color:var(--sub);font-size:12.5px">${esc(a.b)}</span></p>`).join('')}
    ${NUT_SUGG.length?`<div style="font-size:11.5px;color:var(--dim);margin-top:4px">次の一品なら（タップで${SLOT}に追加）</div>
      <div class="nsugg">${NUT_SUGG.map((x,i)=>`<button data-nsugg="${i}"><span>${esc(x.f.n)}${x.f.vary?'<span class="fbadge">目安</span>':''}<small>${x.hits.slice(0,3).map(h=>NUT_L[h[0]]).join('・')}を補える</small></span><b style="font-size:12px;color:var(--sub)">${x.f.k}kcal</b></button>`).join('')}</div>`:''}
    <div class="nut">${rows}</div>
    <div class="hint">縦線が目標。エネルギーとPFCの目標はこのアプリの計算（実測の消費カロリー・勤務とトレーニングによる増減・体重×${S.profile.proteinPerKg}g）、ビタミン・ミネラル・食物繊維・塩分は日本人の食事摂取基準（2020年版）${E.age()>=65?'の50〜64歳の値（65歳以上も代用）':''}。食品の値は概算で、「目安」は商品や店で差が大きいものです。</div>
    ${N.unkItems.length?`<div class="hint" style="color:var(--warn)">ビタミン等の内訳がない品目：${N.unkItems.map(esc).join('、')}。「+」の付いた値はこれらを除いた分で、実際はもっと多いはずです。それだけで足りている・超えている項目は判定し、決められない項目は「保留」にしています（0として数えると不足と誤判定するため）。マイ食品なら登録しなおすと内訳を入れられます。</div>`:''}`;
  return sect('f-nutri', '栄養バランス（14項目）', `${sc}点`, body, true);
}

let DRAFT = null;   // 編集中のワークアウト

function newDraft(date){
  return {id:'w'+Date.now(), date:date, title:'', exercises:[], note:''};
}

/* 持ち時間のプランを「選び直す」＝今の種目リストを入れ替える
   （追加ではなく置き換え。テンプレート未設定の分数は自動生成のメニューが入る） */
function applyPlan(minutes){
  const s = E.suggestSession(VIEW_DATE, minutes, {forceAuto: MENU_AUTO});
  if(!s.items.length){ toast('この持ち時間で組めるメニューがありません'); return; }
  const hasInput = DRAFT && DRAFT.exercises.some(ex=>ex.sets.some(st=>st.reps>0));
  if(hasInput && !confirm(`入力済みの内容を ${minutes}分のプランで置き換えます。よろしいですか？`)) return;

  SESSION_MIN = minutes;
  const existing = S.workouts.find(x=>x.date===VIEW_DATE);
  const base = newDraft(VIEW_DATE);
  if(existing) base.id = existing.id;          // 保存済みの日は同じ記録を更新する
  base.title = (s.source==='template' ? s.tplName : s.plan.label) + `（${minutes}分）`;
  base.exercises = s.items.map(it=>{
    const sets = [];
    for(let i=0;i<it.sets;i++) sets.push({w: it.w!=null ? it.w : null, reps:null, rpe:null});
    return {name: it.name, sets};
  });
  DRAFT = base;
  if(TAB!=='train') go('train'); else render(true);
  toast(`${minutes}分のプランに切り替えました（${s.items.length}種目 / ${s.items.reduce((a,b)=>a+b.sets,0)}セット）`);
}

// テンプレートを編集中のメニューに「追加」する（重量は履歴から自動で入る）
function loadTemplate(tp){
  DRAFT = DRAFT || newDraft(VIEW_DATE);
  if(!DRAFT.title) DRAFT.title = tp.name;
  let added = 0;
  tp.exercises.forEach(item=>{
    if(DRAFT.exercises.some(x=>x.name===item.name)) return;
    const sug = E.nextSuggestion(item.name);
    const sets = [];
    for(let i=0;i<(item.n||3);i++) sets.push({w: sug && sug.w!=null ? sug.w : null, reps:null, rpe:null});
    DRAFT.exercises.push({name:item.name, sets});
    added++;
  });
  if(TAB!=='train'){ go('train'); } else { render(true); }
  toast(added ? `「${tp.name}」を読み込みました` : 'すべて追加済みです');
}

function rangeDays(from, to){ return sortedDays().filter(d=>d>=from&&d<=to).map(d=>S.days[d]); }
function agg(from, to){
  const rows = rangeDays(from,to);
  const mean = (key)=>{ const v=rows.filter(r=>r[key]!=null); return v.length? v.reduce((a,b)=>a+b[key],0)/v.length : null; };
  const cs = E.countSets(E.workoutsIn(from,to));
  const ws = E.weightSeries().filter(p=>p.date>=from&&p.date<=to);
  return {
    n: rows.length,
    weight: ws.length? ws[ws.length-1].ma : null,
    weightStart: ws.length? ws[0].ma : null,
    kcal: mean('kcal'), protein: mean('protein'), fat: mean('fat'), carb: mean('carb'),
    water: mean('water'), sleep: mean('sleepH'), steps: mean('steps'),
    alcoholDays: rows.filter(r=>(r.alcohol||0)>0).length,
    sets: cs.total, sessions: cs.sessions, tonnage: cs.tonnage
  };
}
function cmpRow(label, a, b, unit, digits, lowerBetter){
  const f = v => v==null ? '—' : (digits===0 ? Math.round(v).toLocaleString() : r1(v));
  let dh = '<td class="flat">—</td>';
  if(a!=null && b!=null){
    const diff = a-b;
    const cls = Math.abs(diff) < 1e-6 ? 'flat' : ((diff>0) !== !!lowerBetter ? 'down' : 'up');
    dh = `<td class="${cls}">${diff>0?'+':''}${digits===0?Math.round(diff).toLocaleString():r1(diff)}</td>`;
  }
  return `<tr><td>${label}</td><td>${f(a)}${unit?' '+unit:''}</td><td style="color:var(--dim)">${f(b)}</td>${dh}</tr>`;
}

function renderAnalysis(){
  const date = VIEW_DATE;
  // 暦の週だと「途中までの今週 vs 完了した前週」で不公平になるため、直近7日どうしを比較する
  const twEnd = date, tw = addDays(date,-6);
  const lwEnd = addDays(date,-7), lw = addDays(date,-13);
  const A = agg(tw,twEnd), B = agg(lw,lwEnd);
  const t = E.targets(date);
  const adv = E.advice(date);
  const kcalLower = S.profile.goalType !== 'bulk';

  let h = '';

  /* 週次レビュー */
  h += `<div class="card"><h3>週次レビュー<span class="tag">直近7日（${jpDate(tw)}〜${jpDate(twEnd)}）vs その前の7日</span></h3>
    <div class="tscroll"><table>
      <tr><th>指標</th><th>直近7日</th><th>前の7日</th><th>差</th></tr>
      ${cmpRow('体重(7日平均)', A.weight, B.weight, 'kg', 1, true)}
      ${cmpRow('摂取カロリー', A.kcal, B.kcal, 'kcal', 0, kcalLower)}
      ${cmpRow('タンパク質', A.protein, B.protein, 'g', 0, false)}
      ${cmpRow('脂質', A.fat, B.fat, 'g', 0, false)}
      ${cmpRow('炭水化物', A.carb, B.carb, 'g', 0, false)}
      ${cmpRow('睡眠', A.sleep, B.sleep, 'h', 1, false)}
      ${cmpRow('歩数', A.steps, B.steps, '歩', 0, false)}
      ${cmpRow('水分', A.water, B.water, 'ml', 0, false)}
      ${cmpRow('総セット数', A.sets, B.sets, 'set', 0, false)}
      ${cmpRow('総挙上重量', A.tonnage/1000, B.tonnage/1000, 't', 1, false)}
      ${cmpRow('うち日焼け止め', A.sunDays, B.sunDays, '日', 0, false)}
      ${cmpRow('飲酒', A.alcoholDays, B.alcoholDays, '日', 0, true)}
    </table></div>
    <div class="hint">緑＝望ましい方向への変化。1週間だけの差は誤差を含むので、2〜3週の傾向で判断してください。</div>
  </div>`;

  /* エネルギー収支 */
  const ad = E.tdeeAdaptive(date), w = E.latestWeight(date);
  h += `<div class="card"><h3>エネルギー収支<span class="tag">${t.adaptive?'実測ベース':'計算式ベース'}</span></h3>
    <div class="grid g4">
      ${statCard('基礎代謝 BMR', E.bmr(w).toLocaleString(),'kcal','Mifflin-St Jeor式')}
      ${statCard('推定消費 TDEE', t.tdee.toLocaleString(),'kcal', t.adaptive? `実測${ad.days}日から逆算` : `活動係数 ×${S.profile.activity}`)}
      ${statCard('目標摂取', t.kcal.toLocaleString(),'kcal', {cut:'減量 −18%',recomp:'リコンプ −3%',bulk:'増量 +10%'}[S.profile.goalType])}
      ${statCard('PFC目標', `${t.protein}/${t.fat}/${t.carb}`,'g','P / F / C')}
    </div>
    <div class="hint">${t.adaptive
      ? `直近の平均摂取 ${ad.avgKcal}kcal と体重変化から逆算した実測値です。計算式より個人差を反映します。`
      : '体重と摂取カロリーを10日以上記録すると、あなた個人の実測消費カロリーに自動で切り替わります。'}</div>
  </div>`;

  /* 体脂肪率 */
  const bfPts = sortedDays().filter(d=>S.days[d].bodyFat).map(d=>({x:d,y:S.days[d].bodyFat}));
  if(bfPts.length>=2){
    h += `<div class="card"><h3>体脂肪率の推移</h3>
      ${C.line([{name:'体脂肪率', color:'var(--core)', points:bfPts, dots:true, area:true}],
        {refs:[{y:S.profile.goalBf, label:'目標 '+S.profile.goalBf+'%', color:'var(--warn)'},
               {y:15, label:'輪郭が出る目安 15%', color:'var(--dim)'}], h:190})}
    </div>`;
  }

  /* カロリー */
  const kPts = sortedDays().filter(d=>S.days[d].kcal).slice(-60).map(d=>({x:d,y:S.days[d].kcal}));
  if(kPts.length>=2){
    h += `<div class="card"><h3>摂取カロリー<span class="tag">直近60日</span></h3>
      ${C.line([{name:'摂取', color:'var(--good)', points:kPts, dots:true}],
        {refs:[{y:t.kcal,label:'目標 '+t.kcal, color:'var(--accent)'},{y:t.tdee,label:'消費 '+t.tdee, color:'var(--warn)'}], h:190})}
      <div class="hint">目標線を毎日ぴったり守る必要はありません。1週間の合計が目標×7に収まっていれば同じ結果になります。</div>
    </div>`;
  }

  /* 睡眠 */
  const sPts = sortedDays().filter(d=>S.days[d].sleepH).slice(-60).map(d=>({x:d,y:S.days[d].sleepH}));
  if(sPts.length>=2){
    h += `<div class="card"><h3>睡眠時間<span class="tag">直近60日</span></h3>
      ${C.line([{name:'睡眠', color:'var(--accent2)', points:sPts, dots:true, area:true}],
        {refs:[{y:S.profile.sleepTarget,label:'目標 '+S.profile.sleepTarget+'h',color:'var(--warn)'},{y:6,label:'下限 6h',color:'var(--bad)'}], h:180})}
    </div>`;
  }

  /* 週別ボリューム推移 */
  const weeks = [];
  for(let i=7;i>=0;i--){
    const st = addDays(isoWeekStart(date), -7*i);
    weeks.push({week:st, cs:E.countSets(E.workoutsIn(st, addDays(st,6)))});
  }
  if(weeks.some(w=>w.cs.total>0)){
    h += `<div class="card"><h3>部位別ボリュームの推移<span class="tag">直近8週</span></h3>
      ${C.line(MUSCLES.map(m=>({name:m, color:MUSCLE_COLOR[m], points:weeks.map(w=>({x:w.week,y:w.cs.vol[m]})), w:2, dots:true})), {h:200})}
      <div class="hint">各部位が週の最低ライン（胸10・背中12・肩12・腕6・脚8・体幹4セット）を継続的に超えているかを見ます。</div>
    </div>`;
  }

  /* 全アドバイス */
  h += `<div class="sec-title">コーチングの全項目（${adv.length}件）</div>`;
  h += renderAdviceGroups(adv, 0);

  $('#v-analysis').innerHTML = h;
}

  const dayNames = ['日','月','火','水','木','金','土'];

  h += `<div class="card"><h3>各種基準値</h3>
    <div class="grid g3">
      <div class="field"><label>生活活動レベル</label><select data-p="activity">

  if(S.templates.length || (S.myFoods||[]).length){
    h += `<div class="card"><h3>登録したもの</h3>`;
    if(S.templates.length){
      h += `<div class="sec-title" style="margin-top:0">トレーニングのテンプレート</div>
        ${S.templates.map(tp=>`<div class="mi" style="padding:10px 0;flex-wrap:wrap"><div class="bd">
          <b style="font-size:13.5px">${esc(tp.name)}${tp.min?` <span style="color:var(--accent2);font-size:11px">★ ${tp.min}分に設定中</span>`:''}</b>
          <div class="why">${tp.exercises.map(x=>esc(x.name)).join(' / ')}</div>
          <div class="chips" style="margin-top:7px">
            ${[20,45,75].map(m=>`<div class="chip ${+tp.min===m?'on':''}" data-tmin="${tp.id}|${m}" style="padding:5px 11px;font-size:12px">${m}分</div>`).join('')}
          </div></div>
          <button class="btn ghost sm" data-deltmpl="${tp.id}">削除</button></div>`).join('')}
        <div class="hint">持ち時間を割り当てると、ホームの「今日のメニュー」でその分数を押したときに自動生成の代わりにこれが出ます。同じ分数には1つだけ設定できます（もう一度押すと解除）。</div>`;
    }
    if((S.myFoods||[]).length){
      h += `<div class="sec-title">マイ食品</div>
        ${S.myFoods.map((f,i)=>`<div class="mi" style="padding:8px 0"><div class="bd">
          <b style="font-size:13.5px">${esc(f.n)}</b>
          <div class="why">${f.k}kcal ・ たんぱく質${f.p}g 脂質${f.f}g 炭水化物${f.c}g</div></div>
          <button class="btn ghost sm" data-delfood="${i}">削除</button></div>`).join('')}`;
    }
    h += `</div>`;
  }

  const isFile = location.protocol === 'file:';
  h += `<div class="card"><h3>アプリとして使う<span class="tag">${STANDALONE?'ホーム画面から起動中':'ブラウザで表示中'}</span></h3>`;
  if(STANDALONE){
    h += `<p style="font-size:12.5px;color:var(--sub);line-height:1.9;margin:0">
      ホーム画面のアイコンから起動しています。この状態なら通信がなくても開けます（機内モード・地下でも動作）。<br>
      記録はこの端末の中だけに保存されます。別の端末とは同期しないので、メインで使う端末を1つに決めてください。</p>`;
  }else if(isFile){
    h += `<p style="font-size:12.5px;color:var(--sub);line-height:1.9;margin:0">
      いまはファイルを直接開いている状態（file://）です。この方法ではホーム画面に追加できず、オフライン動作の仕組みも使えません。<br>
      スマホで使うには、このフォルダをWeb上に置いて <b>https://</b> のURLで開く必要があります。</p>`;
  }else if(IS_IOS){
    h += `<p style="font-size:12.5px;color:var(--sub);line-height:1.9;margin:0">
      <b>ホーム画面に追加する手順（iPhone）</b><br>
      1. このページを <b>Safari</b> で開く（Chromeなど他のブラウザでは追加できません）<br>
      2. 下部の共有ボタン <b>□↑</b> をタップ<br>
      3. 「ホーム画面に追加」を選ぶ<br>
      4. ホーム画面のアイコンから起動する<br><br>
      追加後はアドレスバーのない全画面で開き、オフラインでも動きます。</p>`;
  }else{
    h += `<p style="font-size:12.5px;color:var(--sub);line-height:1.9;margin:0">
      ブラウザのアドレスバーにあるインストールアイコン、またはメニューの「アプリをインストール」から追加できます。</p>
      ${INSTALL_PROMPT?`<div class="row" style="margin-top:10px"><button class="btn sm" id="installApp">このアプリをインストール</button></div>`:''}`;
  }
  h += `<div class="hint">データは端末内（localStorage）にのみ保存され、外部には送信されません。端末を替えるときは、下のバックアップを書き出して新しい端末で読み込んでください。</div></div>`;

  h += `<div class="card"><h3>データ<span class="tag">${nDays}日分 / ${nW}トレーニング</span></h3>
    <div class="row">
      <button class="btn ghost sm" id="expJson">バックアップを書き出す（JSON）</button>
      <button class="btn ghost sm" id="impJson">バックアップを読み込む</button>
      <input type="file" id="impFile" accept="application/json" class="hidden">
      <button class="btn ghost sm" id="demoData">デモデータを入れて動きを見る</button>
      <button class="btn danger sm" id="wipe">全データを削除</button>
    </div>
    <div class="hint">データはこの端末のブラウザ内（localStorage）にのみ保存され、外部には一切送信されません。逆に言うとブラウザのデータを消すと失われるので、月1回はバックアップの書き出しをおすすめします。</div>
  </div>`;

  h += `<div class="card"><h3>このアプリについて</h3>
    <p style="font-size:12.5px;color:var(--sub);line-height:1.9;margin:0">
    体重・食事・トレーニング・睡眠を1つのダッシュボードにまとめ、記録から自動でアドバイスを出します。
    参考にした考え方：食事とスコア化は「あすけん」「MyFitnessPal」、トレーニングのログと推定1RM・週間ボリュームは「Hevy」「Strong」、
    次回重量の提案は「Fitbod」、体重の移動平均表示は「Withings」、肌の記録は「TroveSkin」、習慣の連続日数は「Streaks」。<br><br>
    食品データ（${FOODS.length}品目）は日本食品標準成分表と一般的な市販品をもとにした<b>1食分の概算値</b>です。商品ごとの差があるので、正確に管理したい常食は「自分の食品を登録」でパッケージ表示の数値を入れてください。<br><br>
    アドバイスの根拠：減量ペースは体重の1%/週以内、タンパク質は体重×1.6〜2.2g、脂質は体重×0.6g以上、
    週あたりの部位別セット数は10〜20セット、睡眠は7時間以上。いずれも一般的なガイドラインで、医療行為ではありません。
    体調に不安がある場合や持病がある場合は医師・専門家に相談してください。</p>

  $('#v-settings').innerHTML = h;
}

/* ---------------------------------------------------------------
   12. ルーティング & 再描画
   --------------------------------------------------------------- */
function render(keepScroll){
  const y = window.scrollY;
  $('#dateLabel').textContent = jpDate(VIEW_DATE) + (VIEW_DATE===ymd(new Date())?' 今日':'');
  if(TAB==='home') renderHome();
  else if(TAB==='food') renderFood();
  else if(TAB==='log') renderLog();
  else if(TAB==='train') renderTrain();
  else if(TAB==='analysis') renderAnalysis();
  else renderSettings();
  if(keepScroll) window.scrollTo(0, y);
}
function go(tab){
  TAB = tab;
  $$('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  $$('.view').forEach(v=>v.classList.toggle('hidden', v.id !== 'v-'+tab));
  if(tab!=='train') DRAFT = null;
  render();
  window.scrollTo(0,0);
}

/* ---------------------------------------------------------------
   13. イベント
   --------------------------------------------------------------- */
function bind(){
  $$('.tabs button').forEach(b=> b.onclick = ()=> go(b.dataset.tab));
  $('#dPrev').onclick  = ()=>{ VIEW_DATE = addDays(VIEW_DATE,-1); DRAFT=null; render(); };
  $('#dNext').onclick  = ()=>{ VIEW_DATE = addDays(VIEW_DATE, 1); DRAFT=null; render(); };
  $('#dToday').onclick = ()=>{ VIEW_DATE = ymd(new Date()); DRAFT=null; render(); };

  /* ---- 入力（値の反映のみ・再描画しない＝フォーカスを保つ） ---- */
  document.addEventListener('input', e=>{
    const el = e.target;

    // 食品検索（結果だけ差し替えて入力欄のフォーカスを保つ）
    if(el.id==='foodQ'){
      FOOD_Q = el.value;
      const box = $('#foodResults');
      if(box) box.innerHTML = renderFoodResults();
      return;
    }

    // 日次記録
    const k = el.dataset.k;
    if(k){
      const d = day(VIEW_DATE, true);
      d[k] = (k==='note'||k==='homeTime'||k==='workStart'||k==='workEnd'||k==='sleepStart'||k==='sleepEnd') ? el.value : num(el.value);
      if(k==='sleepStart'||k==='sleepEnd'){
        const h2 = sleepHours(d.sleepStart, d.sleepEnd);
        if(h2!=null) d.sleepH = h2;
        const box = $('#sleepCalc'); if(box) box.innerHTML = sleepCalcText(d, E.targets(VIEW_DATE));
      }
      save(); return;
    }
    // プロフィール
    const pk = el.dataset.p;
    if(pk){
      const v = el.value;
      const strKeys = ['name','goalDate','sex','goalType','equipment','mode','weighFreq'];
      if(strKeys.includes(pk))      S.profile[pk] = v;
      else if(pk==='calCycle')      S.profile[pk] = (v==='1');
      else                          S.profile[pk] = num(v) ?? S.profile[pk];
      save(); return;
    }
    // ワークアウトのセット
    const st = el.dataset.set;
    if(st && DRAFT){
      const [i,j,f] = st.split('-');
      const s = DRAFT.exercises[+i].sets[+j];
      s[f] = num(el.value);
      return;
    }
    if(el.id==='wTitle' && DRAFT) DRAFT.title = el.value;
    if(el.id==='wNote'  && DRAFT) DRAFT.note  = el.value;
  });

  document.addEventListener('change', e=>{
    const el = e.target;
    if(el.dataset.p){ save(); render(true); return; }          // select 系はすぐ反映
    if(el.id==='wDate' && DRAFT){ DRAFT.date = el.value; render(true); return; }
    if(el.id==='tmplPick' && el.value){
      const tp = S.templates.find(x=>x.id===el.value);
      el.value = '';
      if(tp) loadTemplate(tp);
      return;
    }
    if(el.id==='exPick' && DRAFT){
      let name = el.value;
      if(!name) return;
      if(name==='__custom'){
        name = prompt('種目名を入力してください');
        if(!name){ el.value=''; return; }
      }
      DRAFT.exercises.push({name, sets:[{w:null,reps:null,rpe:null},{w:null,reps:null,rpe:null},{w:null,reps:null,rpe:null}]});
      el.value=''; render(true); return;
    }
    if(el.id==='photoFile'){
      const f = el.files[0];
      if(f) addPhotoFile(f);
      el.value=''; return;
    }
    if(el.id==='impFile'){
      const f = el.files[0]; if(!f) return;
      const rd = new FileReader();
      rd.onload = ()=>{
        try{
          const obj = JSON.parse(rd.result);
          if(!obj || typeof obj!=='object' || !obj.profile) throw new Error('形式が不正です');
          if(!confirm('現在のデータを読み込んだ内容で置き換えます。よろしいですか？')) return;
          localStorage.setItem(DB_KEY, JSON.stringify(obj));
          load(); render(); toast('読み込みました');
        }catch(err){ alert('読み込みに失敗しました：'+err.message); }
      };
      rd.readAsText(f); el.value='';
    }
  });

  /* ---- クリック ---- */
  document.addEventListener('click', e=>{
    const el = e.target.closest('[data-shift],[data-off],[data-min],[data-food],[data-quick],[data-slot],[data-fq],[data-nsugg],[data-mq],[data-mdel],[data-deltmpl],[data-delfood],[data-fill],[data-loadmin],[data-tmin],[data-outdoor],[data-hint],[data-sect],[data-photo],[data-delphoto],[data-check],[data-rep],[data-alldone],[data-scale] button,[data-addset],[data-delset],[data-delex],[data-editw],[data-delw],button');
    if(!el) return;

    /* ---- 食事 ---- */
    if(el.dataset.slot){ SLOT = el.dataset.slot; render(true); return; }
    if(el.dataset.fq){ FOOD_QTY = +el.dataset.fq; render(true); return; }
    if(el.dataset.food){
      if(addFood(el.dataset.food, FOOD_QTY)) { const q = FOOD_QTY; FOOD_QTY = 1; render(true); toast(`${SLOT}に${q!==1?'×'+q+'で':''}追加しました`); }
      return;
    }
    if(el.dataset.nsugg){
      const x = NUT_SUGG[+el.dataset.nsugg];
      if(x && addFood(x.f.n, 1)){ render(true); toast(`${x.f.n} を${SLOT}に追加しました`); }
      return;
    }
    if(el.dataset.quick){
      if(addFood(el.dataset.quick)) { render(true); toast(`${SLOT}に追加しました`); }
      return;
    }
    if(el.dataset.mq){
      const [id, op] = el.dataset.mq.split('|');
      const d = day(VIEW_DATE, true);
      const m = d.meals.find(x=>x.id===id);
      if(m){
        m.q = Math.round(clamp(m.q + (op==='+'?0.5:-0.5), 0.5, 20)*10)/10;
        afterMealChange(d); render(true);
      }
      return;
    }
    if(el.dataset.mdel){
      const d = day(VIEW_DATE, true);
      d.meals = d.meals.filter(x=>x.id!==el.dataset.mdel);
      afterMealChange(d); render(true); return;
    }
    // 持ち時間を選び直す＝種目リストを入れ替える
    if(el.dataset.loadmin){ applyPlan(+el.dataset.loadmin); return; }
    // 設定タブでの持ち時間の割り当て
    if(el.dataset.tmin){
      const [id, mv] = el.dataset.tmin.split('|');
      const min = mv ? +mv : null;
      const tp = S.templates.find(x=>x.id===id);
      if(!tp) return;
      if(min && +tp.min === min){ tp.min = null; }
      else{
        if(min) S.templates.forEach(x=>{ if(+x.min===min) x.min = null; });
        tp.min = min;
      }
      save(); render(true); toast(tp.min ? `${tp.min}分に設定しました` : '持ち時間の割り当てを外しました');
      return;
    }
    if(el.dataset.delphoto){
      if(!confirm('この写真を削除しますか？')) return;
      PHOTOS = loadPhotos().filter(x=>x.id!==el.dataset.delphoto);
      savePhotos(); render(true); toast('削除しました'); return;
    }
    if(el.dataset.deltmpl){
      S.templates = S.templates.filter(x=>x.id!==el.dataset.deltmpl);
      save(); render(true); toast('削除しました'); return;
    }
    if(el.dataset.delfood!=null){
      S.myFoods.splice(+el.dataset.delfood, 1);
      save(); render(true); toast('削除しました'); return;
    }

    // 折りたたみの開閉
    if(el.dataset.sect){
      const k = el.dataset.sect, u = ui();
      u[k] = !isOpen(k);
      save(); render(true); return;
    }
    // フォーム解説の開閉
    if(el.dataset.hint){
      const n = el.dataset.hint;
      HINT_OPEN[n] = !HINT_OPEN[n];
      render(true); return;
    }
    // 勤務区分
    if(el.dataset.shift){
      const d = day(VIEW_DATE, true);
      d.shift = (d.shift===el.dataset.shift) ? null : el.dataset.shift;
      save(); render(true); return;
    }
    // 定休日
    if(el.dataset.off!=null){
      const i = +el.dataset.off;
      const list = (S.profile.offDays||[]).slice();
      const at = list.indexOf(i);
      if(at>=0) list.splice(at,1); else list.push(i);
      S.profile.offDays = list.sort();
      save(); render(true); return;
    }
    // 持ち時間の選択
    if(el.dataset.min){ SESSION_MIN = +el.dataset.min; render(true); return; }

    // 5段階スケール
    const holder = el.parentElement && el.parentElement.dataset && el.parentElement.dataset.scale;
    if(holder){
      const d = day(VIEW_DATE, true);
      const v = +el.dataset.v;
      d[holder] = (d[holder]===v) ? null : v;
      save();
      Array.from(el.parentElement.children).forEach(b=> b.classList.toggle('on', +b.dataset.v === d[holder]));
      return;
    }

    // ワークアウト編集
    /* ---- セットのチェック（言われたとおりにこなしたら押す） ---- */
    if(el.dataset.check && DRAFT){
      const [i,j] = el.dataset.check.split('-').map(Number);
      const ex = DRAFT.exercises[i], st = ex.sets[j];
      const meta = E.exMeta(ex.name), cardio = meta.m === CARDIO;
      if(st.reps > 0){ st.reps = null; }                    // もう一度押すと取り消し
      else{
        const sug = E.nextSuggestion(ex.name);
        const tw = ex.sets[0].w!=null ? ex.sets[0].w : (sug ? sug.w : null);
        const tr = (sug && sug.reps) ? sug.reps : (cardio ? 20 : 10);
        st.reps = tr;
        if(!cardio && st.w == null) st.w = tw;
      }
      render(true); return;
    }
    if(el.dataset.rep && DRAFT){
      const [pi, pj, op] = el.dataset.rep.split('|');
      const st = DRAFT.exercises[+pi].sets[+pj];
      st.reps = Math.max(1, (st.reps||0) + (op === 'inc' ? 1 : -1));
      render(true); return;
    }
    if(el.dataset.alldone!=null && DRAFT){
      const i = +el.dataset.alldone, ex = DRAFT.exercises[i];
      const meta = E.exMeta(ex.name), cardio = meta.m === CARDIO;
      const sug = E.nextSuggestion(ex.name);
      const tw = ex.sets[0].w!=null ? ex.sets[0].w : (sug ? sug.w : null);
      const tr = (sug && sug.reps) ? sug.reps : (cardio ? 20 : 10);
      ex.sets.forEach(st=>{ st.reps = tr; if(!cardio && st.w==null) st.w = tw; });
      render(true); return;
    }
    // 前回の重量で全セットを埋める
    if(el.dataset.fill!=null && DRAFT){
      const ex = DRAFT.exercises[+el.dataset.fill];
      const hist = S.workouts.filter(w=>w.date!==DRAFT.date && (w.exercises||[]).some(x=>x.name===ex.name))
                             .sort((a,b)=>a.date<b.date?1:-1)[0];
      if(!hist){ toast('過去の記録がありません'); return; }
      const prev = hist.exercises.find(x=>x.name===ex.name).sets.filter(s=>s.reps>0);
      if(!prev.length){ toast('過去の記録がありません'); return; }
      ex.sets.forEach((s,j)=>{ s.w = (prev[j]||prev[prev.length-1]).w; });
      render(true); toast(`${jpDate(hist.date)} の重量を反映しました`);
      return;
    }
    if(el.dataset.addset!=null && DRAFT){
      DRAFT.exercises[+el.dataset.addset].sets.push({w:null,reps:null,rpe:null}); render(true); return;
    }
    if(el.dataset.delset && DRAFT){
      const [i,j] = el.dataset.delset.split('-').map(Number);
      DRAFT.exercises[i].sets.splice(j,1); render(true); return;
    }
    if(el.dataset.delex!=null && DRAFT){
      DRAFT.exercises.splice(+el.dataset.delex,1); render(true); return;
    }
    if(el.dataset.editw){
      const w = S.workouts.find(x=>x.id===el.dataset.editw);
      if(w){ DRAFT = JSON.parse(JSON.stringify(w)); render(); window.scrollTo(0,0); }
      return;
    }
    if(el.dataset.delw){
      if(!confirm('このトレーニング記録を削除しますか？')) return;
      S.workouts = S.workouts.filter(x=>x.id!==el.dataset.delw);
      save(); render(true); toast('削除しました'); return;
    }

    switch(el.id){
      case 'calcKcal': {
        const d = day(VIEW_DATE, true);
        const v = (d.protein||0)*4 + (d.fat||0)*9 + (d.carb||0)*4;
        if(!v){ toast('先にPFCを入力してください'); return; }
        d.kcal = Math.round(v); save(); render(true); toast(d.kcal+'kcal を反映しました'); break;
      }
      case 'quickSave': render(true); toast('記録しました'); break;
      case 'photoPick': $('#photoFile').click(); break;
      case 'installApp': {
        if(!INSTALL_PROMPT) return;
        INSTALL_PROMPT.prompt();
        INSTALL_PROMPT.userChoice.finally(()=>{ INSTALL_PROMPT = null; render(true); });
        break;
      }
      case 'actRefresh': render(true); toast('食事の目標と脚の疲れの判定に反映しました'); break;
      case 'myFoodToggle': MYFOOD_OPEN = !MYFOOD_OPEN; render(true); break;
      case 'copySlot': {
        for(let i=1;i<=14;i++){
          const prev = S.days[addDays(VIEW_DATE,-i)];
          const list = prev && (prev.meals||[]).filter(m=>m.slot===SLOT);
          if(list && list.length){
            const d = day(VIEW_DATE, true);
            list.forEach(m=> d.meals.push(Object.assign(JSON.parse(JSON.stringify(m)), {id:'m'+Date.now()+'_'+Math.round(Math.random()*99999)})));
            afterMealChange(d); render(true); toast(`${jpDate(addDays(VIEW_DATE,-i))}の${SLOT}（${list.length}品）をコピーしました`); return;
          }
        }
        toast(`直近2週間に${SLOT}の記録がありません`); break;
      }
      case 'mfParse': {
        const r = parseLabel($('#mfPaste').value);
        const ids = Object.keys(r.got);
        if(!ids.length && !r.unsure.length){ $('#mfMsg').textContent = '項目名（熱量・たんぱく質・脂質など）が見つかりませんでした。'; return; }
        ids.forEach(id=>{ const el2 = $('#'+id); if(el2) el2.value = r.got[id]; });
        if(MF_EXTRA.some(k=>r.got['mf_'+k]!=null)){ const dt = $('#mfPaste').closest('.ex').querySelector('details'); if(dt) dt.open = true; }
        const unitOf = id => id==='mfK' ? 'kcal' : id.startsWith('mf_') && NUT_U[id.slice(3)] ? NUT_U[id.slice(3)] : 'g';
        const msg = [`読み取り：${ids.map(id=>LABEL_NAME[id]+' '+r.got[id]+unitOf(id)).join('・')}`];
        if(r.naNote) msg.push(r.naNote);
        if(r.empty.length) msg.push(`値が書かれていない項目：${r.empty.join('・')}（空欄＝不明のままにしています）`);
        if(r.unsure.length) msg.push(`要確認（入れていません）：${r.unsure.join('・')}。表示を見て手で入れてください`);
        if(r.per100) msg.push('⚠ 「100gあたり」の表示のようです。1食の量と違う場合は、食べた量に合わせて追加時の量（×0.5など）で調整してください');
        msg.push('下の欄で数値を確かめてから「この内容で登録」を押してください。');
        $('#mfMsg').innerHTML = msg.map(esc).join('<br>');
        $('#mfMsg').style.color = (r.unsure.length||r.per100||r.empty.length) ? 'var(--warn)' : 'var(--sub)';
        break;
      }
      case 'mfSave': {
        const n = ($('#mfN').value||'').trim();
        const k = num($('#mfK').value), pp = num($('#mfP').value), ff = num($('#mfF').value);
        let cc = num($('#mfC').value);
        const sugar = num($('#mfSugar').value), fbv = num($('#mf_fb').value);
        if(!n){ toast('名前を入れてください'); return; }
        if(k==null){ toast('熱量（kcal）は必須です'); return; }
        if(cc==null && sugar!=null){
          if(fbv!=null) cc = Math.round((sugar+fbv)*10)/10;
          else { cc = sugar; toast('食物繊維が分からないので、糖質の値を炭水化物として登録しました'); }
        }
        const mm = MICRO_K.map(x=>{ const el2 = $('#mf_'+x); return el2 ? num(el2.value) : null; });
        S.myFoods.unshift(Object.assign({n, k, p:pp||0, f:ff||0, c:cc||0, g:'マイ食品', r:kana(n), my:1},
          mm.some(v=>v!=null) ? {m:mm} : {}));
        save(); MYFOOD_OPEN = false; FOOD_Q = n; render(true); toast('登録しました');
        break;
      }
      case 'clearMeals': {
        if(!confirm('この日の食事記録をすべて削除しますか？')) return;
        const d = day(VIEW_DATE, true);
        d.meals = []; afterMealChange(d); render(true); toast('削除しました'); break;
      }
      case 'copyPrev': {
        const prev = S.days[addDays(VIEW_DATE,-1)];
        if(!prev){ toast('前日の記録がありません'); return; }
        const cur = day(VIEW_DATE, true);
        const cp = JSON.parse(JSON.stringify(prev));
        cp.date = VIEW_DATE; cp.weight = cur.weight; cp.note = cur.note;
        S.days[VIEW_DATE] = cp; save(); render(true); toast('前日の内容をコピーしました'); break;
      }
      case 'clearDay': {
        if(!confirm(jpDate(VIEW_DATE)+' の記録を削除しますか？')) return;
        delete S.days[VIEW_DATE]; save(); render(); toast('削除しました'); break;
      }
      case 'saveWorkout': {
        if(!DRAFT || !DRAFT.exercises.length){ toast('種目を追加してください'); return; }
        DRAFT.exercises.forEach(ex=> ex.sets = ex.sets.filter(s=> s.reps>0 || s.w>0));
        DRAFT.exercises = DRAFT.exercises.filter(ex=> ex.sets.length);
        if(!DRAFT.exercises.length){ toast('重量と回数を入力してください'); return; }
        const i = S.workouts.findIndex(x=>x.id===DRAFT.id);
        if(i>=0) S.workouts[i] = DRAFT; else S.workouts.push(DRAFT);
        save();
        const prs = E.prsIn(DRAFT.date, DRAFT.date);
        DRAFT = null; render();
        toast(prs.length ? `保存しました 🏆 自己ベスト ${prs.length}件更新！` : '保存しました');
        break;
      }
      case 'resetWorkout': DRAFT = newDraft(VIEW_DATE); render(); break;

      case 'sameAsLast': {
        const hist = S.workouts.filter(w=>w.date!==VIEW_DATE).sort((a,b)=>a.date<b.date?1:-1);
        if(!hist.length){ toast('過去のトレーニング記録がありません'); return; }
        const src = hist[0];
        DRAFT = DRAFT || newDraft(VIEW_DATE);
        DRAFT.title = DRAFT.title || src.title;
        src.exercises.forEach(ex=>{
          if(DRAFT.exercises.some(x=>x.name===ex.name)) return;
          DRAFT.exercises.push({name:ex.name, sets: ex.sets.map(s=>({w:s.w, reps:null, rpe:null}))});  // 重量だけ引き継ぐ
        });
        render(true); toast(`${jpDate(src.date)}「${src.title||'トレーニング'}」の構成を読み込みました`);
        break;
      }
      case 'saveTmpl': {
        if(!DRAFT || !DRAFT.exercises.length){ toast('先に種目を追加してください'); return; }
        const minSel = $('#tmplMin') ? $('#tmplMin').value : '';
        const name = prompt('テンプレート名', DRAFT.title || (minSel ? minSel+'分メニュー' : 'マイメニュー'));
        if(!name) return;
        const min = minSel ? +minSel : null;
        if(min) S.templates = S.templates.filter(t=> +t.min !== min);   // 同じ持ち時間は1つだけ
        S.templates.push({id:'t'+Date.now(), name, min,
          exercises: DRAFT.exercises.map(ex=>({name:ex.name, n:ex.sets.length}))});
        save(); render(true);
        toast(min ? `${min}分のメニューとして設定しました` : 'テンプレートに保存しました');
        break;
      }

      case 'menuToggle': MENU_AUTO = !MENU_AUTO; render(true); break;

      case 'useMenu': {
        const existing = S.workouts.find(x=>x.date===VIEW_DATE);
        DRAFT = existing ? JSON.parse(JSON.stringify(existing)) : null;
        applyPlan(SESSION_MIN || E.dayPlan(VIEW_DATE).minutes);
        break;
      }

      case 'expJson': {
        const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'ikemenlab-backup-'+ymd(new Date())+'.json';
        a.click(); URL.revokeObjectURL(a.href);
        S.meta.lastBackup = ymd(new Date()); save(); render(true);
        toast('バックアップを書き出しました'); break;
      }
      case 'impJson': $('#impFile').click(); break;
      case 'demoData': {
        if(!confirm('デモデータを生成します。現在のデータは置き換わります。よろしいですか？')) return;
        makeDemo(); save(); render(); toast('デモデータを生成しました'); break;
      }
      case 'wipe': {
        if(!confirm('全てのデータを削除します。取り消せません。よろしいですか？')) return;
        localStorage.removeItem(DB_KEY); load(); render(); toast('削除しました'); break;
      }
    }
  });
}

/* ---------------------------------------------------------------
   14. デモデータ
   --------------------------------------------------------------- */
function makeDemo(){
  S = JSON.parse(JSON.stringify(DEFAULT_STATE));
  S.meta.created = addDays(ymd(new Date()), -49);
  S.profile = Object.assign(S.profile, {name:'', height:172, birthYear:1995, goalType:'cut', goalWeight:66, goalBf:12,
    activity:1.5, equipment:'home', mode:'build', offDays:[2,3], calCycle:true,
    weighFreq:'weekly', weighDay:2});

  const today = ymd(new Date());
  const rnd = (a,b)=> a + Math.random()*(b-a);
  let w = 74.2, bf = 19.5;

  for(let i=49;i>=0;i--){
    const date = addDays(today, -i);
    const d = blankDay(date);
    const dow = parseYmd(date).getDay();
    w  -= rnd(0.02, 0.10);                       // 週 −0.4kg前後
    bf -= rnd(0.01, 0.035);
    // 測定は週1回（火曜）だけ。ウエストも同じ日に測る
    if(parseYmd(date).getDay() === S.profile.weighDay){
      d.weight     = r1(w + rnd(-0.6, 0.6));     // 測定日ごとのブレ
      d.bodyFat    = r1(bf + rnd(-0.4, 0.4));
      d.waist      = r1(82 - (49-i)*0.06);
      d.muscleRate = r1(32.5 + (49-i)*0.012 + rnd(-0.3,0.3));
      d.visceral   = Math.round(9 - (49-i)*0.02);
      d.bmrScale   = Math.round(1560 - (49-i)*0.3 + rnd(-15,15));
    }

    // 結婚式場のシフト：火水休み、土日は挙式対応で消耗が大きい
    const wknd = (dow===0||dow===6);
    const off = (dow===2||dow===3);
    d.shift = off ? 'off' : (wknd ? 'wedding' : (Math.random()<0.06 ? 'allnight' : 'work'));
    d.workStart = off ? '' : (d.shift==='wedding' ? '08:00' : '10:00');
    d.workEnd = off ? '' :
      (d.shift==='allnight' ? '05:00'
       : d.shift==='wedding' ? (Math.random()<0.5?'21:30':'22:30')
       : (Math.random()<0.35 ? '23:30' : '19:30'));
    d.protein = Math.round(rnd(130,165));
    d.fat     = Math.round(rnd(50,72));
    d.carb    = Math.round(wknd? rnd(190,260) : rnd(140,200));
    d.kcal    = Math.round(d.protein*4 + d.fat*9 + d.carb*4);
    d.water   = Math.round(rnd(1600,2800)/50)*50;
    d.alcohol = off && Math.random()<0.5 ? Math.round(rnd(1,3)) : 0;
    d.sleepH  = r1(d.shift==='allnight' ? rnd(2,4)
                 : off ? rnd(6.8,8.5)
                 : (d.shift==='wedding' ? rnd(5.2,6.8) : rnd(6,7.5)));
    d.sleepQ  = clamp(Math.round(d.sleepH-3), 1, 5);
    d.steps   = Math.round((d.shift==='wedding' ? rnd(12000,18000) : off ? rnd(3500,8000) : rnd(6000,11000))/100)*100;
    // 屋外に出るのはガーデン挙式・前撮り対応と、休みの外出のとき
    d.mood = clamp(Math.round(rnd(2.5,5)),1,5);
    d.stress = clamp(Math.round(rnd(1,4)),1,5);
    S.days[date] = d;
  }

  // 直近5日は食品検索で登録した状態にしておく（機能の見本）
  const demoMeals = [['朝','卵 1個(50g)',2],['朝','ごはん 茶碗1杯(150g)',1],['朝','納豆 1パック(45g)',1],
    ['昼','サラダチキン 1個(110g)',1],['昼','おにぎり 鮭',2],['昼','味噌汁 1杯',1],
    ['夕','鮭 1切れ(80g)',1],['夕','ごはん 茶碗1杯(150g)',1],['夕','ブロッコリー(100g)',1],
    ['間食','プロテイン 1杯(30g)',1]];
  for(let i=4;i>=0;i--){
    const date = addDays(today,-i), d = S.days[date];
    if(!d) continue;
    d.meals = demoMeals.map((x,j)=>{
      const f = FOODS.find(y=>y.n===x[1]);
      return {id:'dm'+i+'_'+j, slot:x[0], name:f.n, q:x[2], k:f.k, p:f.p, f:f.f, c:f.c};
    });
    E.syncMeals(d);
  }

  // 火＝上半身メイン、水＝下半身メイン、帰宅が早い勤務日にときどき20分の補填
  const plans = {
    upper:[['ダンベルベンチプレス',22],['ダンベルロウ(ワンハンド)',24],['ダンベルショルダープレス',16],['サイドレイズ',8],['ダンベルカール',12]],
    lower:[['ゴブレットスクワット',24],['ダンベルルーマニアンデッドリフト',26],['ブルガリアンスクワット',14],['カーフレイズ',20],['アブローラー',0]],
    topup:[['サイドレイズ',8],['バンドロウ',0],['リアレイズ',6]]
  };
  for(let i=49;i>=0;i--){
    const date = addDays(today, -i);
    const dow = parseYmd(date).getDay();
    const rec = S.days[date];
    let key = null;
    if(dow===2) key='upper';
    else if(dow===3) key='lower';
    else if(rec && rec.workEnd==='19:30' && Math.random()<0.45) key='topup';
    if(!key) continue;
    if(Math.random()<0.12) continue;              // 予定どおりに行かない日もある
    const grow = 1 + (49-i)/49*0.10;              // 7週で約10%伸びる
    const wk = {id:'w'+i+'_'+Math.round(Math.random()*1e6), date,
      title:{upper:'メイン① 上半身',lower:'メイン② 下半身',topup:'補填（肩・背中）'}[key], exercises:[], note:''};
    plans[key].forEach(([name, base])=>{
      const load = base ? Math.round(base*grow/2)*2 : 0;
      wk.exercises.push({name, sets:[
        {w:load, reps:Math.round(rnd(9,12)), rpe:8},
        {w:load, reps:Math.round(rnd(8,11)), rpe:8.5},
        {w:load, reps:Math.round(rnd(7,10)), rpe:9}
      ]});
    });
    S.workouts.push(wk);
  }

  S.templates = [
    {id:'t_demo1', name:'メイン① 上半身', min:75, exercises:[
      {name:'ダンベルベンチプレス',n:3},{name:'ダンベルロウ(ワンハンド)',n:3},
      {name:'ダンベルショルダープレス',n:3},{name:'サイドレイズ',n:3},{name:'ダンベルカール',n:3}]},
    {id:'t_demo2', name:'メイン② 下半身', min:45, exercises:[
      {name:'ゴブレットスクワット',n:3},{name:'ダンベルルーマニアンデッドリフト',n:3},
      {name:'ブルガリアンスクワット',n:3},{name:'アブローラー',n:3}]},
    {id:'t_demo3', name:'20分 補填（肩・背中）', min:20, exercises:[
      {name:'サイドレイズ',n:3},{name:'バンドロウ',n:3},{name:'リアレイズ',n:2}]}
  ];
}

/* ---------------------------------------------------------------
   15. アプリとしての起動（PWA）
   --------------------------------------------------------------- */
// ホーム画面から起動されているか（iOS / Android 共通で判定）
const STANDALONE = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
let INSTALL_PROMPT = null;

window.addEventListener('beforeinstallprompt', e=>{     // Android/Chrome 用
  e.preventDefault(); INSTALL_PROMPT = e;
  if(TAB==='settings') render(true);
});

// http(s) で配信されているときだけ Service Worker を登録する（file:// では動かない）
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

/* ---------------------------------------------------------------
   16. 起動
   --------------------------------------------------------------- */
load();
bind();
render();
